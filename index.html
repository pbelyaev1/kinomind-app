/* ------------------------------------------------------------ ИИ-подсказки
   Модель знает кино широко, но путается в деталях, поэтому она только называет
   фильмы — а существуют ли они и что у них с рейтингом, проверяет TMDB.
   Результат хранится в профиле: он синхронизируется и не тратит лимит заново. */
const AIW={};                 /* id → {ai, why}: подписи только для карточек рекомендаций */
function aiStamp(p){
  const n=Object.keys(p.ratings||{}).length+(p.lists.seen||[]).length+(p.lists.later||[]).length;
  return 'v2:'+Math.floor(n/3)+':'+(p.nov===undefined?1:p.nov)+':'+(p.hide||[]).length+(p.hideFr||[]).length;
}
function aiTaste(p){
  const rated=Object.entries(p.ratings||{}).map(([id,v])=>({f:byId(id),v})).filter(x=>x.f);
  const liked=rated.filter(x=>x.v>=7).sort((a,b)=>b.v-a.v).slice(0,25)
    .map(x=>`${x.f.o||x.f.t}${x.f.y?' ('+x.f.y+')':''} — ${x.v}/10`);
  const meh=rated.filter(x=>x.v<=5).slice(0,10).map(x=>`${x.f.o||x.f.t}`);
  const seen=(p.lists.seen||[]).map(byId).filter(Boolean).slice(-40).map(f=>f.o||f.t);
  const frs=Array.from(new Set([].concat(
    Object.keys(p.ratings||{}),(p.lists.seen||[])).map(id=>frKey(byId(id))).filter(Boolean))).slice(0,25);
  const w=affinity(p);
  const good=Object.entries(w).filter(([,v])=>v>0.6).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]);
  const bad=Object.entries(w).filter(([,v])=>v<-0.6).sort((a,b)=>a[1]-b[1]).slice(0,4).map(x=>x[0]);
  return {liked,meh,seen,frs,good,bad};
}
/* Проверка на месте: модель любит уводить в «важное кино», хотя человек
   пришёл за фантастикой. Сверяем жанры найденного фильма с реальным вкусом. */
function genreFit(p,f,strict){
  const t=aiTaste(p);
  if(!t.good.length) return true;
  const g=f.g||[];
  if(!g.length) return !strict;
  if(g.some(x=>t.bad.includes(x))&&!g.some(x=>t.good.includes(x))) return false;
  if(g.some(x=>t.good.includes(x))) return true;
  if(strict) return false;
  /* мягкая проверка: хотя бы соседний жанр по духу */
  const near={'Фантастика':['Фэнтези','Приключения','Боевик','Триллер'],
    'Фэнтези':['Фантастика','Приключения','Анимация'],'Боевик':['Триллер','Приключения','Криминал'],
    'Триллер':['Детектив','Криминал','Ужасы','Боевик'],'Ужасы':['Триллер','Детектив'],
    'Комедия':['Мелодрама','Семейный','Приключения'],'Драма':['Мелодрама','История','Военный'],
    'Детектив':['Триллер','Криминал'],'Криминал':['Триллер','Детектив'],
    'Анимация':['Семейный','Фэнтези','Приключения'],'Семейный':['Анимация','Приключения','Комедия']};
  return t.good.some(x=>(near[x]||[]).some(y=>g.includes(y)));
}
let aiBusy=false;
async function ensureAiRecs(p){
  if(aiBusy||!aiOn()) return false;
  const sig=aiStamp(p), cur=p.ai||{};
  const fresh=cur.sig===sig&&cur.at&&(Date.now()-cur.at)<5*24*3600*1000&&(cur.items||[]).length;
  if(fresh) return false;
  const t=aiTaste(p);
  if(t.liked.length<3&&t.seen.length<5) return false;      /* пока нечего анализировать */
  aiBusy=true;
  try{
    const nov=p.nov===undefined?1:p.nov;
    const sys='Ты кинокритик с очень широким кругозором: фестивальное кино, независимое, '+
      'европейское, азиатское, старое, недооценённое. Отвечай только валидным JSON без пояснений.';
    const fav=(p.fav||[]).join(', ');
    const user=[
      'ЖАНРЫ, КОТОРЫЕ ЧЕЛОВЕК ЛЮБИТ: '+(t.good.join(', ')||fav||'пока неизвестно')+'.',
      fav&&fav!==t.good.join(', ')?'Он сам отметил как любимые: '+fav+'.':'',
      t.bad.length?'ЖАНРЫ, КОТОРЫЕ ЕМУ НЕ ЗАХОДЯТ: '+t.bad.join(', ')+'.':'',
      '',
      'Что он смотрел и как оценил.',
      'Понравилось: '+(t.liked.join('; ')||'—'),
      t.meh.length?'Не понравилось: '+t.meh.join('; '):'',
      t.seen.length?'Уже видел: '+t.seen.slice(0,40).join('; '):'',
      t.frs.length?'Франшизы, которые уже знакомы (продолжений не предлагать): '+t.frs.join('; '):'',
      '',
      'Предложи 14 фильмов или сериалов, которые ему стоит посмотреть.',
      'Жёсткие правила, по порядку важности:',
      '1. ЖАНР ГЛАВНЕЕ ВСЕГО. Минимум 11 из 14 должны быть в его любимых жанрах'+
        (t.good.length?' ('+t.good.join(', ')+')':'')+'. '+
        'Не подсовывай социальную драму человеку, который любит фантастику, только потому,'+
        ' что драма «важное кино». Если в его жанрах не хватает редкого — бери менее известное'+
        ' внутри этих жанров, но жанр не меняй.',
      t.bad.length?'2. Ничего из жанров '+t.bad.join(', ')+'.':'2. —',
      '3. Никаких сиквелов, приквелов и других частей перечисленных франшиз.',
      '4. Не предлагай общеизвестные хиты, которые видел каждый (Матрица, Титаник, Крёстный отец, Начало и подобное).',
      nov>=2?'5. Бери преимущественно малоизвестное внутри его жанров: фестивальное, независимое, неанглоязычное, старое.'
            :(nov===1?'5. Смесь: часть известного, но не заезженного, часть редкого — но всё в его жанрах.'
                     :'5. Можно и известное, но не то, что видели вообще все.'),
      '6. Разные страны и десятилетия — не повторяй один и тот же тип.',
      '7. Только реально существующие фильмы с точным годом выпуска.',
      '',
      'В поле why объясняй через его вкус: на что из просмотренного это похоже и чем отличается.',
      'Формат ответа: {"films":[{"title":"русское название","original":"оригинальное название",'+
      '"year":2011,"genre":"основной жанр","why":"одно короткое предложение по-русски, почему именно ему"}]}'
    ].filter(Boolean).join('\n');
    const d=await aiJson([{role:'system',content:sys},{role:'user',content:user}],
      {temperature:nov>=2?1.0:0.8,max_tokens:1800,timeout:60});
    const films=(d&&(d.films||d.movies||d.items))||[];
    if(!films.length){ p.ai={sig,at:Date.now(),items:(cur.items||[])}; save(false); return false }
    const items=[];
    for(const x of films.slice(0,16)){
      const q=String(x.original||x.title||'').trim();
      if(!q) continue;
      const yr=parseInt(x.year,10)||0;
      const r=await api('/search/multi',{query:q,include_adult:false,page:1},60*24*30).catch(()=>null);
      let list=((r&&r.results)||[]).filter(z=>z.media_type!=='person');
      if(yr) list.sort((a,b)=>{
        const ya=parseInt(String(a.release_date||a.first_air_date||'').slice(0,4),10)||0;
        const yb=parseInt(String(b.release_date||b.first_air_date||'').slice(0,4),10)||0;
        return Math.abs(ya-yr)-Math.abs(yb-yr);
      });
      const hit=list[0]?mapItem(list[0]):null;
      if(!hit) continue;
      if(yr&&hit.y&&Math.abs(hit.y-yr)>2) continue;                 /* модель ошиблась — не берём */
      if((p.lists.seen||[]).includes(hit.id)||p.ratings[hit.id]!==undefined) continue;
      if(isHidden(p,hit)) continue;
      if(items.some(z=>z.id===hit.id)) continue;
      if(nov>=2&&(hit.votes||0)>200000) continue;      /* в режиме редкого хиты не нужны */
      const why=String(x.why||'').slice(0,120);
      reg([hit]); remember(hit);
      items.push({id:hit.id,why,g:hit.g||[]});
    }
    /* жанровая проверка: сначала строгая, если осталось совсем мало — мягкая */
    let keep=items.filter(x=>genreFit(p,{g:x.g},true));
    if(keep.length<5) keep=items.filter(x=>genreFit(p,{g:x.g},false));
    if(keep.length<3) keep=items;
    keep.forEach(x=>{ AIW[x.id]={ai:true,why:x.why} });
    p.ai={sig,at:Date.now(),nov,items:keep.map(x=>({id:x.id,why:x.why}))};
    save(false);
    return keep.length>0;
  }catch(e){ return false }
  finally{ aiBusy=false }
}
/* уже подобранное ИИ — достаём из профиля мгновенно, без запросов */
function aiPicks(p){
  const nov=p.nov===undefined?1:p.nov;
  if(p.ai&&p.ai.nov!==undefined&&p.ai.nov!==nov) return [];   /* режим сменился — ждём новую выборку */
  return ((p.ai&&p.ai.items)||[]).map(x=>{
    const f=byId(x.id); if(!f) return null;
    AIW[f.id]={ai:true,why:x.why||''};
    return f;
  }).filter(Boolean);
}

async function youFetch(page){
  const p=P();
  const plan=seedPlan(p);
  if(!plan.length){
    if(page===1){ ensureAiRecs(p).then(ok=>{ if(ok){ delete ROWDATA.you; SIG.you=null; YOU.fresh=true;
      if(route.v==='home') bootHome() } }) }
    const g=await genreFetch(p,page);
    return page===1?aiPicks(p).concat(g):g;
  }
  /* первый экран смешивает похожее на два ваших фильма и свежее в ваших жанрах —
     так подборка меняется и от новой отметки в библиотеке, и от смены жанров */
  if(page===1){
    /* обновление подсказок идёт в фоне: экран не ждёт медленную модель */
    ensureAiRecs(p).then(ok=>{ if(ok){ delete ROWDATA.you; SIG.you=null; YOU.fresh=true;
      if(route.v==='home') bootHome() } });
    const parts=await Promise.all([
      aiPicks(p),
      ...plan.slice(0,2).map(s=>seedRecs(s).catch(()=>[])),
      genreFetch(p,1).catch(()=>[])
    ]);
    const out=[], has=new Set();
    for(let i=0;i<20;i++) parts.forEach(l=>{ const f=l[i]; if(f&&!has.has(f.id)){has.add(f.id);out.push(f)} });
    if(out.length>6) return out;
    return genreFetch(p,1);
  }
  /* дальше по кнопке «Показать ещё»: следующие семена, каждая четвёртая страница — жанры */
  if(page%4===0){ const l=await genreFetch(p,page/4).catch(()=>[]); if(l.length>4) return l }
  const step=plan[page];
  if(step){ const l=await seedRecs(step).catch(()=>[]); if(l.length>4) return l }
  return genreFetch(p,page);
}
function duoPartner(){
  const me=P(); const rest=DB.profiles.filter(x=>x.id!==me.id);
  if(!rest.length) return null;
  return rest.find(x=>x.id===DEV.duo)||rest[0];
}
/* С кем считаем общее. По умолчанию — со всеми, кто есть в семье: так работает
   и вдвоём, и вчетвером. Чипами можно сузить до одного человека. */
function duoTargets(){
  const me=P(), rest=DB.profiles.filter(x=>x.id!==me.id);
  if(!rest.length) return [];
  if(DEV.duo&&DEV.duo!=='all'){ const one=rest.find(x=>x.id===DEV.duo); if(one) return [one] }
  return rest;
}
function duoNames(){ return duoTargets().map(x=>x.name) }
function duoTitle(){
  const t=duoTargets(); if(!t.length) return 'Смотрим вместе';
  if(t.length===1) return P().name+' + '+t[0].name;
  return 'Смотрим все вместе';
}
function duoSub(){
  const t=duoTargets(); if(!t.length) return '';
  const all=[P().name].concat(t.map(x=>x.name));
  return all.slice(0,-1).join(', ')+' и '+all[all.length-1];
}
/* вес жанра для компании: любим все — высоко, расходимся — штраф.
   Работает и для двоих, и для любого числа человек. */
function duoAffinity(){
  const t=duoTargets(); if(!t.length) return {};
  const ws=[affinity(P())].concat(t.map(affinity));
  const out={}, keys=new Set();
  ws.forEach(w=>Object.keys(w).forEach(g=>keys.add(g)));
  keys.forEach(g=>{
    const v=ws.map(w=>w[g]||0);
    const avg=v.reduce((a,b)=>a+b,0)/v.length;
    const spread=Math.max(...v)-Math.min(...v);
    out[g]=avg-spread*0.4;
  });
  return out;
}
/* Семена для двоих: сначала то, что оба оценили высоко, потом высокие оценки
   каждого по очереди — так подборка не съезжает во вкус кого-то одного. */
function duoSeeds(){
  const me=P(), t=duoTargets(); if(!t.length) return [];
  const all=[me].concat(t);
  const fr=new Set(), has=new Set(), out=[];
  const push=f=>{ if(!f||!f.tmdb||has.has(f.id)) return;
    if(all.some(x=>isHidden(x,f))) return;
    const k=frKey(f); if(k){ if(fr.has(k)) return; fr.add(k) }
    has.add(f.id); out.push(f) };
  duoLiked().forEach(push);
  const top=x=>Object.entries(x.ratings||{}).filter(([,v])=>v>=8)
    .map(([id])=>byId(id)).filter(Boolean).reverse();
  const lists=all.map(top);
  const max=Math.max(0,...lists.map(l=>l.length));
  /* по кругу от каждого — чтобы подборка не съехала во вкус кого-то одного */
  for(let i=0;i<max&&out.length<10;i++) lists.forEach(l=>push(l[i]));
  return out.slice(0,10);
}
async function duoFetch(page){
  const me=P(); if(!duoTargets().length) return [];
  const w=duoAffinity();
  const nov=novDi(me);
  const ids=Object.entries(w).filter(([,v])=>v>0.25).sort((a,b)=>b[1]-a[1])
    .slice(0,3).map(([g])=>gidOf(g,'movie')).filter(Boolean);
  const seeds=duoSeeds();
  const plan=[]; for(let sub=1;sub<=3;sub++) seeds.forEach(f=>plan.push({f,sub}));
  let list=[];
  if(page===1){
    const parts=await Promise.all([
      ...plan.slice(0,2).map(x=>seedRecs(x).catch(()=>[])),
      discoverByGenres(ids,nov,1).catch(()=>[])
    ]);
    const has=new Set();
    for(let i=0;i<20;i++) parts.forEach(l=>{ const f=l[i]; if(f&&!has.has(f.id)){has.add(f.id);list.push(f)} });
    if(list.length<6) list=await discoverByGenres(ids,nov,1).catch(()=>[]);
  } else if(page%4===0){
    list=await discoverByGenres(ids,nov,page/4).catch(()=>[]);
  } else {
    const step=plan[page];
    list=step?await seedRecs(step).catch(()=>[]):[];
    if(list.length<5) list=await discoverByGenres(ids,nov,page).catch(()=>[]);
  }
  return list;
}
/* ранжирование для двоих: пропускаем всё, что видел или спрятал любой из них */
function rankDuo(list,st){
  const me=P(), t=duoTargets(); if(!t.length) return [];
  const all=[me].concat(t);
  const skip=new Set();
  all.forEach(x=>{ (x.lists.seen||[]).forEach(id=>skip.add(id));
    Object.keys(x.ratings||{}).forEach(id=>skip.add(id)) });
  const seenFr={};
  all.forEach(x=>Object.entries(seenFrMap(x)).forEach(([k,v])=>seenFr[k]=(seenFr[k]||0)+v));
  return rankYou(list,me,st,{w:duoAffinity(),nov:novOfD(me),seenFr,skip,
    hidden:f=>all.some(x=>isHidden(x,f))});
}
/* Совпадения в «посмотреть позже»: оба независимо захотели одно и то же —
   это лучший кандидат на совместный вечер, его и показываем отдельным рядом. */
function duoBoth(){
  const me=P(), t=duoTargets(); if(!t.length) return [];
  const mine=(me.lists.later||[]);
  const cnt={}, who={};
  mine.forEach(id=>{ cnt[id]=1; who[id]=[me.name] });
  t.forEach(pa=>{
    const seen=new Set(pa.lists.seen||[]);
    (pa.lists.later||[]).forEach(id=>{
      if(!cnt[id]) return;                        /* нас интересует только то, что хочу и я */
      if(seen.has(id)) return;
      cnt[id]++; who[id].push(pa.name);
    });
  });
  const mySeen=new Set(me.lists.seen||[]);
  const ids=Object.keys(cnt).filter(id=>cnt[id]>1&&!mySeen.has(id));
  ids.sort((a,b)=>cnt[b]-cnt[a]||mine.indexOf(b)-mine.indexOf(a));
  return ids.map(id=>{ const f=byId(id); if(!f) return null;
    BOTHWHO[id]=who[id]; return f }).filter(Boolean);
}
const BOTHWHO={};

function duoLiked(){
  const me=P(), t=duoTargets(); if(!t.length) return [];
  return Object.keys(me.ratings||{})
    .filter(id=>me.ratings[id]>=7&&t.some(pa=>(pa.ratings||{})[id]>=7))
    .map(byId).filter(Boolean);
}

   Поэтому спрашиваем три раза и склеиваем: общий список, прокат по датам
   именно для России и отдельно российское кино — иначе своё тонет в голливудском. */
async function nowPlaying(){
  const ru=(DB.region||'RU')==='RU';
  const from=shiftDate(-2), to=today();
  const q=extra=>Object.assign({with_release_type:'2|3',
    'release_date.gte':from,'release_date.lte':to,
    sort_by:'popularity.desc','vote_count.gte':0},ru?{region:'RU'}:{},extra||{});
  const jobs=[
    api('/movie/now_playing',ru?{region:'RU'}:{},60*6).then(d=>mapList(d,'movie')).catch(()=>[]),
    api('/discover/movie',q(),60*6).then(d=>mapList(d,'movie')).catch(()=>[])
  ];
  if(ru) jobs.push(api('/discover/movie',q({with_origin_country:'RU'}),60*6)
    .then(d=>mapList(d,'movie').map(x=>{x._ru=true;return x})).catch(()=>[]));
  const parts=await Promise.all(jobs);
  const has=new Set(), out=[];
  /* сначала своё, потом остальное — иначе российские премьеры не видно */
  const order=ru?[parts[2]||[],parts[1]||[],parts[0]||[]]:[parts[1]||[],parts[0]||[]];
  order.forEach(l=>l.forEach(f=>{
    if(!f||has.has(f.id)) return;
    const rd=String(f.rd||'').slice(0,10);
    if(rd&&(rd>to||rd<shiftDate(-5))) return;      /* ещё не вышло или давно сошло */
    has.add(f.id); f.st='cinema'; out.push(f);
  }));
  return out.slice(0,40);
}

/* Отбор и сортировка кандидатов для «Для вас»: убираем скрытое и просмотренное,
   считаем счёт с учётом режима «неочевидного» и не пускаем больше одного фильма
   из одной серии — чтобы подборка не превращалась в парад «Человеков-пауков». */
function rankYou(list,p,st,opts){
  opts=opts||{};
  const w=opts.w||affinity(p);
  const ctx={nov:opts.nov!==undefined?opts.nov:novOf(p),seenFr:opts.seenFr||seenFrMap(p)};
  const seen=opts.skip||new Set(p.lists.seen||[]);
  const hid=opts.hidden||(f=>isHidden(p,f));
  const fr=(st&&st.fr)||{};
  if(st) st.fr=fr;
  const ranked=list
    .filter(f=>f&&!seen.has(f.id)&&!hid(f))
    .map(f=>({f,s:recScore(f,w,p,ctx)}))
    .sort((a,b)=>b.s-a.s)
    .filter(o=>{ const k=frKey(o.f); if(!k) return true;
      fr[k]=(fr[k]||0)+1; return fr[k]<=1 })
    .map(o=>o.f);
  if(ctx.nov<1) return ranked;
  /* то, что видели вообще все, уходит в самый хвост: пусть сначала будет
     то, чего человек не знает, а «Матрица» найдётся и без нас */
  const big=[], rest=[];
  ranked.forEach(f=>((f.votes||0)>300000?big:rest).push(f));
  return rest.concat(big);
}

  const el=$('#you-more'); if(!el||!('IntersectionObserver' in window)) return;
  youIO=new IntersectionObserver(es=>{ if(es.some(e=>e.isIntersecting)) loadMoreYou() },{rootMargin:'700px'});
  youIO.observe(el);
}

/* ------------------------------------------------- живое обновление подборки
   Отпечаток вкуса — всё, что вообще влияет на рекомендации: любимые жанры,
   каждая оценка, «посмотреть позже», «просмотрено» (включая импорт из заметки)
   и сам профиль. Меняется отпечаток — «Для вас» и «Смотрим вместе»
   пересобираются сами, без кнопок и перезагрузки. */
function tasteSig(p){
  p=p||P(); if(!p||!p.id) return '';
  const r=Object.entries(p.ratings||{}).map(([k,v])=>k+':'+v).sort().join(',');
  return [p.id,(p.fav||[]).slice().sort().join('|'),r,
    (p.lists.later||[]).slice().sort().join('|'),
    (p.lists.seen||[]).slice().sort().join('|'),
    (p.hide||[]).slice().sort().join('|'),(p.hideFr||[]).slice().sort().join('|'),
    'n'+(p.nov===undefined?1:p.nov),'d'+novDi(p)].join('#');
}
function duoSig(){ return tasteSig()+'/'+duoTargets().map(tasteSig).join('/') }
function bothSig(){ return duoBoth().map(f=>f.id).join(',') }
const SIG={};
let tasteTimer=null;
function tasteWatch(){ try{ tasteWatchRun() }catch(e){} }   /* до полной загрузки — молча пропускаем */
function tasteWatchRun(){
  let n=0;
  if(SIG.you&&SIG.you!==tasteSig()){
    delete ROWDATA.you; SIG.you=null; YOU.page=1; YOU.done=false; YOU.empty=0; YOU.fresh=true; n++;
  }
  if(SIG.duo&&SIG.duo!==duoSig()){ delete ROWDATA.duo; SIG.duo=null;
    DUO.page=1; DUO.done=false; DUO.empty=0; n++ }
  if(SIG.both!==undefined&&SIG.both!==bothSig()){ delete ROWDATA.both; SIG.both=bothSig(); n++ }
  if(SIG.both===undefined&&DB.profiles.length>1&&duoBoth().length&&!ROWDATA.both) n++;
  if(!n) return;
  clearTimeout(tasteTimer);
  /* короткая пауза: пока человек ставит оценки подряд, не дёргаем базу на каждую */
  tasteTimer=setTimeout(()=>{ if(route.v==='home') bootHome() },700);
}

/* --------------------------------------------------- франшизы и «не показывать»
   «Человек-паук», «Человек-паук 2», «Человек-паук: Нет пути домой» — одна серия.
   Ключ считаем по оригинальному названию: так «Spider-Man» и «Человек-паук»
   не разъезжаются. Если из карточки известна коллекция TMDB — берём её, она точнее. */
const FR_WORDS=/\b(part|chapter|episode|vol|volume|the|a|an|часть|части|глава|эпизод|фильм)\b/g;
const ROMAN=/^(i{1,3}|iv|v|vi{1,3}|ix|x{1,2})$/;
function frNorm(v){
  let s=String(v||'').toLowerCase();
  s=s.split(/\s*[:—–]\s*|\s+-\s+|\s*\|\s*/)[0];          // всё после двоеточия — подзаголовок
  s=s.replace(/[«»"'’.,!?()\[\]]/g,' ').replace(FR_WORDS,' ');
  s=s.split(/\s+/).filter(w=>w&&!/^\d+$/.test(w)&&!ROMAN.test(w)).join(' ').trim();
  return s.length>=4?s:'';
}
/* ключ хранится техническим, а показываем человеку понятную часть */
function frLabel(k){
  const t=String(k||'').split('~').pop().replace(/^c\d+$/,'');
  return t?t.charAt(0).toUpperCase()+t.slice(1):'без названия';
}
function frKey(f){
  if(!f) return '';
  if(f.coll) return 'c'+f.coll;
  /* и оригинал, и русское название: «Spider-Man» и «Человек-паук» должны
     сойтись, но одинаковое служебное слово в оригинале не должно склеивать
     разные фильмы — поэтому берём пару и требуем совпадения обеих частей */
  const o=frNorm(f.o), t=frNorm(f.t);
  if(o&&t) return o+'~'+t;
  return o||t||'';
}
function isHidden(p,f){
  if(!f) return false;
  if((p.hide||[]).includes(f.id)) return true;
  const k=frKey(f);
  return !!k&&(p.hideFr||[]).includes(k);
}
/* сколько фильмов серии человек уже посмотрел или оценил */
function seenFrMap(p){
  const m={};
  const add=id=>{ const f=byId(id); const k=f&&frKey(f); if(k) m[k]=(m[k]||0)+1 };
  (p.lists.seen||[]).forEach(add);
  Object.keys(p.ratings||{}).forEach(add);
  return m;
}
const NOV=[0,0.55,1.15];                 /* популярное · сбалансировано · незаезженное */
const NOV_LABEL=['Популярное','Сбалансировано','Незаезженное'];
const novOf=p=>NOV[Math.max(0,Math.min(2,p.nov===undefined?1:p.nov))];
const novDi=p=>(p.novD===undefined?(p.nov===undefined?1:p.nov):p.novD);
const novOfD=p=>NOV[Math.max(0,Math.min(2,novDi(p)))];

/* ---------------------------------------------------------------- рекомендации */
function affinity(p){
  const w={};
  (p.fav||[]).forEach(g=>w[g]=(w[g]||0)+2.4);
  Object.entries(p.ratings||{}).forEach(([id,v])=>{
    const f=byId(id); if(!f||!f.g)return;
    const k=(v-6.4)*0.42;
    f.g.forEach(g=>w[g]=(w[g]||0)+k);
  });
  (p.lists.later||[]).forEach(id=>{
    const f=byId(id); if(f&&f.g) f.g.forEach(g=>w[g]=(w[g]||0)+0.7);
  });
  /* просмотренное без оценки — слабый, но честный сигнал: смотреть же зачем-то стали */
  (p.lists.seen||[]).forEach(id=>{
    if(p.ratings[id]!==undefined) return;
    const f=byId(id); if(f&&f.g) f.g.forEach(g=>w[g]=(w[g]||0)+0.25);
  });
  return w;
}
function recScore(f,w,p,ctx){
  ctx=ctx||{};
  const nov=ctx.nov!==undefined?ctx.nov:novOf(p);
  const base=f.kp||f.tm||f.im||6;
  let s=base*0.75+(f.im||f.tm||6)*0.25;
  let g=0;(f.g||[]).forEach(x=>g+=(w[x]||0));
  s+=clamp(g,-6,9)*0.55;
  s+=clamp((f.y||2000)-2017,0,9)*0.07;
  /* популярность больше не бонус сама по себе: в режиме «незаезженное»
     блокбастеры, которые видели все, наоборот уезжают вниз */
  const pop=clamp(Math.log10((f.votes||0)+1)-3.3,0,2.2);
  s+=clamp(Math.log10((f.votes||0)+1),0,5)*0.12*(1-nov*0.75);
  s-=pop*1.9*nov;
  /* спрятанная жемчужина: высокий балл при скромной известности */
  if(nov>0&&(f.kp||f.tm||0)>=7.2&&(f.votes||0)<40000) s+=1.1*nov;
  const fk=frKey(f), seenFr=ctx.seenFr||{};
  if(fk&&seenFr[fk]) s-=5;                    /* эту серию человек уже смотрел */
  if(AIW[f.id]&&AIW[f.id].ai) s+=nov>=1?1.9:1.2;   /* находки ИИ поднимаем повыше */
  if(p.ratings[f.id]!==undefined) s-=7;
  if((p.lists.seen||[]).includes(f.id)) s-=9;
  s+=(hash(f.id+p.id)%1000)/2600;
  return s;
}
function recReason(p){
  const w=affinity(p);
  const n=seedCount(p);
  const top=Object.entries(w).filter(([,v])=>v>0.8).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>x[0]);
  const ai=((p.ai&&p.ai.items)||[]).length;
  const by=(n?'по '+n+' '+plural(n,'фильму','фильмам','фильмам')+' из вашей библиотеки':'')
    +(ai?(n?' + ':'')+ai+' от ИИ':'');
  if(!top.length) return by||'оценивайте фильмы — подборка станет точнее';
  return 'вам нравится: '+top.join(', ').toLowerCase()+(by?' · '+by:'');
}

/* ---------------------------------------------------------------- уведомления */
function notifications(p){
  const out=[]; const seen=new Set();
  const add=(id,i,c,t,d,w)=>{if(seen.has(id))return;seen.add(id);out.push({id,i,c,t,d,w,read:(p.read||[]).includes(id)})};
  (p.lists.later||[]).forEach(id=>{
    const f=byId(id); if(!f)return;
    const st=stOf(f);
    const rd=String(f.rd||'').slice(0,10);
    if(st==='cinema') add('n:cin:'+id,'🎬','#FF9147','«'+f.t+'» сейчас в кинотеатрах','Из вашего списка'+(rd?' · премьера '+dateRu(rd):''),'сейчас');
    else if(st==='soon'&&rd>today()) add('n:soon:'+id,'📅','#8B5CF6','«'+f.t+'» выходит '+(rd?dateRu(rd):('в '+f.y)),'Напомним в день релиза','скоро');
    else if(st==='prod') add('n:prod:'+id,'🎥','#9AA0B2','«'+f.t+'» ещё снимается','Дата выхода пока не объявлена','—');
    else if(f.y>=new Date().getFullYear()-1) add('n:dig:'+id,'✨','#3ED9A4','«'+f.t+'» доступен в цифре','Можно смотреть прямо сейчас','новое');
  });
  const favs=Object.entries(affinity(p)).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);
  const pool=(ROWDATA.digital||[]).concat(ROWDATA.cinema||[]);
  pool.filter(f=>(f.g||[]).some(g=>favs.includes(g))&&!(p.lists.later||[]).includes(f.id)&&!(p.lists.seen||[]).includes(f.id))
    .slice(0,3).forEach(f=>add('n:new:'+f.id,'🔥','#FF5F45','Новинка в жанре «'+f.g.find(g=>favs.includes(g))+'»',
      '«'+f.t+'» — '+(f.kp?('КП '+f.kp.toFixed(1)):('TMDB '+(f.tm||0).toFixed(1))),'на этой неделе'));
  (ROWDATA.soon||[]).slice(0,2).forEach(f=>add('n:up:'+f.id,'🗓','#38BDF8','Скоро в прокате: «'+f.t+'»',
    (f.rd?dateRu(f.rd):f.y)+(f.g&&f.g.length?' · '+f.g.join(', '):''),'анонс'));
  return out;
}

/* ---------------------------------------------------------------- тосты */
function toast(msg,ok){
  let box=$('.toasts'); if(!box){box=document.createElement('div');box.className='toasts';document.body.appendChild(box)}
  const t=document.createElement('div'); t.className='toast';
  t.innerHTML=(ok===false?'':ic('check'))+'<span>'+esc(msg)+'</span>';
  box.appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),320)},2400);
}

/* ---------------------------------------------------------------- списки */
const inList=(p,k,id)=>(p.lists[k]||[]).includes(id);
function toggleList(k,id){
  const p=P(); const l=p.lists[k]=p.lists[k]||[]; const i=l.indexOf(id);
  const names={later:'«Посмотреть позже»',seen:'«Просмотрено»'};
  if(i>=0){l.splice(i,1);toast('Удалено из '+names[k]+' · '+p.name,false); if(k==='seen')RATEHINT=''}
  else{l.push(id); const it=byId(id); if(it)remember(it); toast('Добавлено в '+names[k]+' · '+p.name);
    /* отметили просмотренным — сразу предлагаем поставить оценку, не уходя со страницы */
    if(k==='seen'&&p.ratings[id]===undefined) RATEHINT=id;
  }
  save(); softRender();
  if(RATEHINT===id&&route.v==='detail'){ const el=$('#det-rate');
    if(el&&el.scrollIntoView) el.scrollIntoView({behavior:'smooth',block:'nearest'}) }
}
function setRating(id,v){
  const p=P();
  RATEHINT='';
  if(p.ratings[id]===v){delete p.ratings[id];toast('Оценка снята · '+p.name,false)}
  else{p.ratings[id]=v; const it=byId(id); if(it)remember(it);
    if(!inList(p,'seen',id))(p.lists.seen=p.lists.seen||[]).push(id); toast('Оценка '+v+' · профиль '+p.name)}
  save(); softRender();
}

function hueOf(f){return hash((f.id||'')+(f.t||''))%360}

   а приложение проверяет каждое название по TMDB. */
async function moodAsk(){
  const q=($('#moodq')&&$('#moodq').value||'').trim();
  if(q.length<3){ toast('Опишите настроение парой слов',false); return }
  MOODS2.q=q; MOODS2.busy=true; MOODS2.err=''; paint();
  try{
    const p=P(), t=aiTaste(p);
    const d=await aiJson([
      {role:'system',content:'Ты подбираешь кино под настроение. Знаешь и мейнстрим, и редкое. Отвечай только валидным JSON.'},
      {role:'user',content:[
        'Человек описал настроение так: «'+q+'».',
        t.good.length?'Обычно ему нравятся жанры: '+t.good.join(', ')+'.':'',
        t.seen.length?'Уже видел (не предлагать): '+t.seen.slice(0,30).join('; '):'',
        '',
        'Подбери 10 фильмов или сериалов ровно под это настроение.',
        'Правила: только реально существующее с точным годом; не больше двух общеизвестных хитов;',
        'настроение важнее привычных жанров — если человек просит грустное, не подсовывай боевик.',
        'Также определи 1–3 жанра из списка: '+GENRES.join(', ')+'.',
        '',
        'Формат: {"genres":["Драма"],"label":"короткое название настроения, 1–3 слова",',
        '"films":[{"title":"русское название","original":"оригинал","year":2011,"why":"чем подходит, одна фраза"}]}'
      ].filter(Boolean).join('\n')}],
      {temperature:0.8,max_tokens:1600,timeout:70});
    const films=(d&&d.films)||[];
    const out=[];
    for(const x of films.slice(0,12)){
      const qq=String(x.original||x.title||'').trim(); if(!qq) continue;
      const yr=parseInt(x.year,10)||0;
      const r=await api('/search/multi',{query:qq,include_adult:false,page:1},60*24*30).catch(()=>null);
      let list=((r&&r.results)||[]).filter(z=>z.media_type!=='person');
      if(yr) list.sort((a,b)=>{
        const ya=parseInt(String(a.release_date||a.first_air_date||'').slice(0,4),10)||0;
        const yb=parseInt(String(b.release_date||b.first_air_date||'').slice(0,4),10)||0;
        return Math.abs(ya-yr)-Math.abs(yb-yr);
      });
      const hit=list[0]?mapItem(list[0]):null;
      if(!hit) continue;
      if(yr&&hit.y&&Math.abs(hit.y-yr)>2) continue;
      if(out.some(z=>z.id===hit.id)) continue;
      AIW[hit.id]={ai:true,why:String(x.why||'').slice(0,120)};
      out.push(hit);
    }
    if(!out.length){ MOODS2.err='Не удалось подобрать'+(AI.err?': '+AI.err:'. Попробуйте описать иначе'); }
    else{
      MOODS2.res=reg(out);
      MOODS2.label=String((d&&d.label)||q).slice(0,40);
      const gs=((d&&d.genres)||[]).filter(g=>GENRES.includes(g)).slice(0,3);
      Object.assign(F,F_DEF,{q:'',g:gs,open:false,tm:6.2,sort:'rate'});
      F.page=1; SR.items=[];
      runSearch(false);
    }
  }catch(e){ MOODS2.err='Сбой: '+(e&&e.message||'не вышло') }
  MOODS2.busy=false; paint();
  setTimeout(()=>{const el=$('#row-moodres'); if(el) el.scrollIntoView({behavior:'smooth',block:'start'})},150);
}

async function runSearch(append){

      const d=await api('/search/'+mt,{query:F.q.trim(),page:F.page,include_adult:false},60);
      items=mapList(d,mt==='multi'?null:mt); total=d.total_results||0; pages=d.total_pages||1;
    }else{
      if(F.type==='all'){
        const [a,b]=await Promise.all([
          api('/discover/movie',buildDiscover('movie'),60*3).catch(()=>null),
          api('/discover/tv',buildDiscover('tv'),60*3).catch(()=>null)]);
        const la=mapList(a,'movie'), lb=mapList(b,'tv');
        items=[]; const n=Math.max(la.length,lb.length);
        for(let i=0;i<n;i++){if(la[i])items.push(la[i]);if(lb[i])items.push(lb[i])}
        total=((a&&a.total_results)||0)+((b&&b.total_results)||0);
        pages=Math.max((a&&a.total_pages)||1,(b&&b.total_pages)||1);
      }else{
        const mt=F.type==='movie'?'movie':'tv';
        const d=await api('/discover/'+mt,buildDiscover(mt),60*3);
        items=mapList(d,mt); total=d.total_results||0; pages=d.total_pages||1;
      }
      if(F.st!=='all'&&F.type!=='movie') items.forEach(x=>{if(x.mt==='movie')x.st=F.st});
    }
  }catch(e){
    items=offlineSearch(); total=items.length; pages=1;
  }
  if(token!==SR.token) return;
  if(!items.length&&!F.q.trim()&&OFFLINE){items=offlineSearch();total=items.length}
  if(F.kp>0) items=items.filter(x=>(x.kp||0)>=F.kp);
  if(F.st!=='all') items=items.filter(x=>!x.st||stOf(x)===F.st||F.q.trim());
  reg(items);
  SR.items=append?SR.items.concat(items):items; SR.total=total; SR.pages=pages; SR.loading=false;
  paintResults();
}

    if(F.st!=='all'&&f.st!==F.st)return false;
    if(F.g.length&&!F.g.every(g=>f.g.includes(g)))return false;
    if(F.tm>0&&(f.im||0)<F.tm)return false;
    if(F.kp>0&&(f.kp||0)<F.kp)return false;

/* Перевод зарубежных рецензий и короткая выжимка — по кнопке, чтобы не тратить
   дневной лимит модели на каждый открытый фильм. Ответы кэшируются на две недели. */
async function revTranslate(id){
  const f=DETAIL[id]; if(!f||!(f.reviews||[]).length||f.revBusy) return;
  f.revBusy='tr'; softRender();
  try{
    const src=f.reviews.map((r,i)=>(i+1)+'. '+String(r.t).slice(0,1100)).join('\n\n');
    const d=await aiJson([
      {role:'system',content:'Ты переводчик. Переводишь зрительские рецензии на русский живо и без канцелярита. Отвечай только JSON.'},
      {role:'user',content:'Переведи каждую рецензию на русский, сохранив нумерацию и тон автора. '+
        'Ничего не сокращай и не добавляй от себя.\n\n'+src+
        '\n\nФормат: {"items":[{"n":1,"text":"перевод"}]}'}],
      {temperature:0.3,max_tokens:2400,timeout:80});
    const items=(d&&d.items)||[];
    if(items.length){
      items.forEach(x=>{ const i=(parseInt(x.n,10)||0)-1;
        if(f.reviews[i]&&x.text) f.reviews[i].t=String(x.text) });
      f.revRu=true;
    } else toast('Перевод не получился'+(AI.err?': '+AI.err:''),false);
  }catch(e){ toast('Не удалось перевести: '+(e&&e.message||'сбой'),false) }
  f.revBusy=''; softRender();
}
/* Разбор запасного текстового ответа: «Хвалят: … Ругают: … Вывод: …» */
function parseDigestText(t){
  if(!t) return null;
  const grab=re=>{ const m=String(t).match(re); return m?m[1].trim():'' };
  const split=v=>v.split(/\s*[;•·]\s*|\s*\n\s*[-–—]?\s*|\s*,\s*(?=[а-яa-z])/i)
    .map(x=>x.replace(/^[-–—*\d.)\s]+/,'').trim()).filter(x=>x.length>2).slice(0,4);
  const good=grab(/хвал[а-я]*\s*[:：]([\s\S]*?)(?=руга|вывод|итог|$)/i);
  const bad=grab(/руга[а-я]*\s*[:：]([\s\S]*?)(?=вывод|итог|хвал|$)/i);
  const verdict=grab(/(?:вывод|итог)\s*[:：]([\s\S]*)$/i);
  if(!good&&!bad) return null;
  return {good:split(good),bad:split(bad),verdict:verdict.split(/\n/)[0].slice(0,180)};
}
async function revDigest(id){
  const f=DETAIL[id]; if(!f||!(f.reviews||[]).length||f.revBusy) return;
  f.revBusy='sum'; softRender();
  AI.err='';
  try{
    /* вход режем: длинные отзывы съедают лимит ответа, и модель обрывается на полуслове */
    const src=f.reviews.slice(0,5)
      .map((r,i)=>(i+1)+'. ['+(r.sc?r.sc+'/10':'без оценки')+'] '+String(r.t).slice(0,650)).join('\n\n');
    const task='Вот отзывы зрителей на «'+(f.t||'')+'».\n\n'+src+
      '\n\nСделай короткую выжимку по-русски: что хвалят и что ругают, по 2–4 пункта, '+
      'каждый пункт 3–7 слов, и одна фраза общего вывода. Только то, что есть в отзывах.';
    const d=await aiJson([
      {role:'system',content:'Ты собираешь выжимку из зрительских отзывов. Отвечай только валидным JSON.'},
      {role:'user',content:task+'\nФормат JSON: {"good":["..."],"bad":["..."],"verdict":"одна фраза"}'}],
      {temperature:0.3,max_tokens:1200,timeout:70});
    let sum=(d&&(d.good||d.bad))?{good:d.good||[],bad:d.bad||[],verdict:d.verdict||''}:null;
    if(!sum){
      /* последняя попытка — обычным текстом, его разберём сами */
      const txt=await aiAsk([{role:'system',content:'Ты кратко пересказываешь зрительские отзывы по-русски.'},
        {role:'user',content:task+'\nОтветь ровно тремя строками:\nХвалят: пункт; пункт; пункт\n'+
          'Ругают: пункт; пункт\nВывод: одна фраза'}],
        {temperature:0.3,max_tokens:600,timeout:70,fresh:true});
      sum=parseDigestText(txt);
    }
    if(sum&&(sum.good.length||sum.bad.length)) f.revSum=sum;
    else toast('Выжимка не собралась'+(AI.err?': '+AI.err:''),false);
  }catch(e){ toast('Выжимка не собралась: '+(e&&e.message||'сбой'),false) }
  f.revBusy=''; softRender();
}

const ACTOR={};
let ACTFILM='all';
const DEPT={Acting:'актёр',Directing:'режиссёр',Writing:'сценарист',Production:'продюсер',
  Sound:'композитор',Camera:'оператор',Editing:'монтажёр',Art:'художник'};
async function loadActor(id){
  ACTOR[id]={loading:true};
  if(route.v==='actor'&&route.id===id) softRender();
  try{
    const d=await api('/person/'+id,{append_to_response:'combined_credits,external_ids'},60*24*7);
    const seen=new Set();
    const roles=[];
    const push=(x,role,job)=>{
      const mt=x.media_type==='tv'?'tv':'movie';
      const it=mapItem(x,mt);
      if(!it||!it.t) return;
      const key=it.id+'|'+(role||job||'');
      if(seen.has(it.id)) {                       /* уже был — дополним роль */
        const prev=roles.find(r=>r.f.id===it.id);
        if(prev&&job&&prev.job&&prev.job.indexOf(job)<0) prev.job+=', '+job;
        return;
      }
      seen.add(it.id);
      roles.push({f:it,role:role||'',job:job||'',pop:x.popularity||0,
        y:it.y||0,ep:x.episode_count||0});
    };
    const cc=d.combined_credits||{};
    (cc.cast||[]).forEach(x=>push(x,x.character||'',''));
    (cc.crew||[]).forEach(x=>push(x,'',{Director:'режиссёр',Screenplay:'сценарий',Writer:'сценарий',
      Producer:'продюсер','Original Music Composer':'музыка','Director of Photography':'оператор'}[x.job]||x.job||''));
    roles.forEach(r=>reg([r.f]));
    ACTOR[id]={loading:false,
      id, n:d.name||'', o:d.also_known_as&&d.also_known_as[0]||'',
      ph:d.profile_path||null, bio:(d.biography||'').trim(),
      dept:DEPT[d.known_for_department]||'',
      birth:d.birthday||'', death:d.deathday||'', place:d.place_of_birth||'',
      pop:d.popularity||0, imdb:(d.external_ids&&d.external_ids.imdb_id)||'',
      roles, top:roles.slice().sort((a,b)=>b.pop-a.pop).slice(0,10).map(r=>r.f)};
  }catch(e){ ACTOR[id]={loading:false,error:true,n:''} }
  if(route.v==='actor'&&route.id===id) softRender();
}

  if(m<0||(m===0&&end.getDate()<b.getDate())) y--;

}

/* --- загрузка детальной карточки --- */
async function loadDetail(id){
  const base=byId(id);
  let mt = base?base.mt : (id[0]==='t'?'tv':'movie');
  let tid = base&&base.tmdb ? base.tmdb : (/^[mt]\d+$/.test(id)?+id.slice(1):0);

  if(!tid){                              // элемент из офлайн-каталога — попробуем найти в TMDB
    const o=OFFBY[id];
    if(o){
      const f=Object.assign({},offItem(o));
      f.cast=(o.cast||[]).map(n=>({n})); f.shots=[]; f.reviews=genReviews(o); f.revSrc='gen';
      f.similar=OFF.filter(x=>x.id!==o.id&&x.g.some(g=>o.g.includes(g))).slice(0,14).map(offItem);
      DETAIL[id]=f; if(route.v==='detail'&&route.id===id) softRender();
      try{
        const s=await api('/search/'+(o.k==='series'?'tv':'movie'),{query:o.o||o.t,year:o.y},60*24*7);
        const hit=(s.results||[])[0];
        if(hit){ tid=hit.id; mt=o.k==='series'?'tv':'movie'; }
      }catch(e){ return }
    }
    if(!tid) return;
  }

  const cacheKey='det:'+mt+tid;
  const cached=cacheGet(cacheKey,60*24*3);
  if(cached){ finishDetail(id,cached); }
  try{
    const det=await api(`/${mt}/${tid}`,{append_to_response:'credits,images,videos,reviews,recommendations,similar,external_ids,'+(mt==='tv'?'content_ratings':'release_dates'),include_image_language:'ru,en,null'},60*24*3);
    const f=mapDetail(det,mt);
    cachePut(cacheKey,f);
    finishDetail(id,f);
    enrichKP(id,(det.external_ids&&det.external_ids.imdb_id)||'',tid);
  }catch(e){
    if(!DETAIL[id]&&base){
      const f=Object.assign({},base); f.cast=f.cast||[]; f.shots=[]; f.reviews=genReviews(f); f.revSrc='gen';
      DETAIL[id]=f; if(route.v==='detail'&&route.id===id) softRender();
    }
  }
}
function finishDetail(id,f){
  const prev=DETAIL[id]||{};
  DETAIL[id]=Object.assign({},prev,f,{id});
  REG[id]=Object.assign(REG[id]||{},DETAIL[id]);
  const p=P();
  if(p.items&&p.items[id]) remember(DETAIL[id]),save();
  if(route.v==='detail'&&route.id===id) softRender();
}
/* Всё про сериал, что отдаёт TMDB: сезоны, серии, чем закончилось и когда дальше.
   next_episode_to_air и last_episode_to_air приходят прямо в карточке сериала. */
const TV_STATUS={'Returning Series':'Продолжается','Ended':'Завершён','Canceled':'Закрыт',
  'Cancelled':'Закрыт','In Production':'Снимается','Planned':'Анонсирован','Pilot':'Пилот'};
function tvInfo(det){
  const ep=e=>e?{d:String(e.air_date||''),s:e.season_number||0,n:e.episode_number||0,t:e.name||''}:null;
  const raw=det.status||'';
  /* у части сериалов в базе стоит киношный статус — тогда выводим по фактам */
  const guess=det.next_episode_to_air?'Продолжается':(det.in_production?'Снимается':'Статус уточняется');
  return {
    status:TV_STATUS[raw]||(TV_STATUS[raw]===undefined&&/^(Returning|Ended|Cancel|In Prod|Planned|Pilot)/.test(raw)?raw:guess),
    raw,
    prod:!!det.in_production,
    seasons:det.number_of_seasons||0,
    eps:det.number_of_episodes||0,
    first:String(det.first_air_date||''),
    last:String(det.last_air_date||''),
    next:ep(det.next_episode_to_air),
    prev:ep(det.last_episode_to_air),
    nets:(det.networks||[]).map(n=>n.name).slice(0,3),
    list:(det.seasons||[]).filter(x=>x.season_number>0).map(x=>({
      n:x.season_number,eps:x.episode_count||0,d:String(x.air_date||''),t:x.name||''}))
  };
}
function mapDetail(det,mt){
  const base=mapItem(det,mt);
  const crew=(det.credits&&det.credits.crew)||[];
  const dirs=crew.filter(c=>c.job==='Director'||c.job==='Series Director').map(c=>c.name);
  const created=(det.created_by||[]).map(c=>c.name);
  const f=Object.assign(base,{
    g:(det.genres||[]).map(g=>{
        const n=String(g.name||'');
        const hit=GENRES.find(x=>x.toLowerCase()===n.toLowerCase());
        return hit||(n.charAt(0).toUpperCase()+n.slice(1));
      }).filter((v,i,a2)=>a2.indexOf(v)===i).slice(0,4),
    d:det.overview||base.d,
    tagline:det.tagline||'',
    co:(det.production_countries||[]).map(c=>c.name).slice(0,2).join(', '),
    dur:det.runtime||((det.episode_run_time||[])[0])||0,
    seasons:det.number_of_seasons||0, eps:det.number_of_episodes||0,
    tv:mt==='tv'?tvInfo(det):null,
    dir:(dirs.length?dirs:created).slice(0,2).join(', '),
    budget:det.budget||0, revenue:det.revenue||0,
    age:ageFromDetail(det,mt),
    st:statusFromDetail(det,mt),
    imdbId:(det.external_ids&&det.external_ids.imdb_id)||'',
    cast:((det.credits&&det.credits.cast)||[]).slice(0,18).map(c=>({id:c.id,n:c.name,r:c.character||'',p:c.profile_path||null})),
    crew:crew.filter(c=>['Director','Screenplay','Writer','Story','Original Music Composer'].includes(c.job))
      .filter((c,i,a2)=>a2.findIndex(x=>x.id===c.id)===i).slice(0,6)
      .map(c=>({id:c.id,n:c.name,job:{Director:'режиссёр',Screenplay:'сценарий',Writer:'сценарий',
        Story:'история','Original Music Composer':'музыка'}[c.job]||c.job})),
    shots:((det.images&&det.images.backdrops)||[]).slice(0,14).map(b=>b.file_path),
    videos:((det.videos&&det.videos.results)||[]).filter(v=>v.site==='YouTube'&&['Trailer','Teaser','Clip','Featurette'].includes(v.type))
      .sort((a,b)=>(a.type==='Trailer'?-1:1)-(b.type==='Trailer'?-1:1))
      .slice(0,8).map(v=>({key:v.key,name:v.name,type:v.type})),
    loading:false,
    similar:reg(mapList(det.recommendations&&det.recommendations.results&&det.recommendations||det.similar,mt).slice(0,16))
  });
  if(!f._b&&f.shots.length) f._b=f.shots[0];
  const tr=((det.reviews&&det.reviews.results)||[]).map(r=>({
    a:r.author_details&&r.author_details.username||r.author,
    s:'TMDB', date:r.created_at,
    sc:r.author_details&&r.author_details.rating?Math.round(r.author_details.rating):0,
    t:(r.content||'').replace(/\r?\n{2,}/g,'\n').trim()
  })).filter(r=>r.t);
  f.reviews=tr.slice(0,6); f.revSrc=tr.length?'tmdb':'';
  if(!f.reviews.length){ f.reviews=[]; f.revSrc='' }
  const k=kpFor(f); if(k&&!f.kp){f.kp=k.kp;f.im=k.im}
  return f;
}
async function enrichKP(id,imdbId,tmdbId){
  const f0=DETAIL[id];
  if(!kpOn()){ if(f0){f0.kpChecked=true; if(route.v==='detail'&&route.id===id) softRender()} return }
  const sel=['id','name','year','rating','votes','ageRating','movieLength','shortDescription',
             'description','poster','backdrop','genres','countries','externalId'];
  let d=imdbId ? await kpdev('/v1.4/movie',{'externalId.imdb':imdbId,limit:1,selectFields:sel}) : null;
  if((!d||!d.docs||!d.docs.length)&&tmdbId)
    d=await kpdev('/v1.4/movie',{'externalId.tmdb':tmdbId,limit:1,selectFields:sel});
  /* запасной путь: ищем по названию и году — так находятся старые фильмы,
     у которых в Кинопоиске не проставлены внешние id */
  if((!d||!d.docs||!d.docs.length)&&f0&&(f0.o||f0.t)){
    const q=(f0.o||f0.t);
    const sr=await kpdev('/v1.4/movie/search',{query:q,limit:5});
    const cands=(sr&&sr.docs)||[];
    const pick=cands.find(x=>f0.y&&x.year===f0.y)||cands[0];
    if(pick&&pick.id) d=await kpdev('/v1.4/movie',{id:pick.id,limit:1,selectFields:sel});
  }
  const doc=d&&d.docs&&d.docs[0];
  if(!doc){ if(f0){f0.kpChecked=true; if(route.v==='detail'&&route.id===id) softRender()} return }
  const f=DETAIL[id]; if(!f) return;

  const r=doc.rating||{};
  if(r.kp>0)   f.kp=Math.round(r.kp*10)/10;
  if(r.imdb>0) f.im=Math.round(r.imdb*10)/10;
  if(doc.votes&&doc.votes.kp) f.kpVotes=doc.votes.kp;
  if(doc.ageRating!=null&&doc.ageRating!=='') f.age=String(doc.ageRating);
  if(!f.d&&(doc.description||doc.shortDescription)) f.d=doc.description||doc.shortDescription;
  if(doc.shortDescription&&!f.tagline) f.tagline=doc.shortDescription;
  if(!f._p&&doc.poster&&doc.poster.url) f.kpPoster=doc.poster.url;
  if(!f._b&&doc.backdrop&&doc.backdrop.url) f.kpBack=doc.backdrop.url;
  if(doc.id) f.kpId=doc.id;
  f.kpChecked=true;

  if(f.kp||f.im){ KPR[id]={kp:f.kp||0,im:f.im||0}; kprSave() }
  if(REG[id]) Object.assign(REG[id],{kp:f.kp,im:f.im,age:f.age,kpVotes:f.kpVotes}); else REG[id]=f;
  if(route.v==='detail'&&route.id===id) softRender();

  if(!doc.id) return;
  const rv=await kpdev('/v1.4/review',{movieId:doc.id,limit:10,sortField:'date',sortType:-1});
  const list=(rv&&rv.docs||[]).map(x=>({
    a:x.author||'Зритель', s:'Кинопоиск', date:x.date,
    sc:x.userRating?Math.round(x.userRating):(x.type==='Позитивный'?9:x.type==='Негативный'?4:6),
    kind:x.type||'',
    t:((x.title?x.title+'. ':'')+(x.review||'')).replace(/<[^>]+>/g,' ').replace(/&[a-z]+;/g,' ').replace(/\s{2,}/g,' ').trim()
  })).filter(x=>x.t.length>40);
  f.kpRevCount=(rv&&(rv.total||(rv.docs||[]).length))||0;
  if(list.length){
    /* показываем разные мнения: сначала положительные, потом остальные */
    const pos=list.filter(x=>x.kind==='Позитивный'), neg=list.filter(x=>x.kind==='Негативный'),
          neu=list.filter(x=>!['Позитивный','Негативный'].includes(x.kind));
    f.reviews=[].concat(pos.slice(0,3),neg.slice(0,2),neu.slice(0,2)).slice(0,6);
    f.revSrc='kp';
    if(route.v==='detail'&&route.id===id) softRender();
  }
}

/* --- запасные отзывы (только офлайн) --- */
const RV_A=['Алексей М.','Марина_К','Дмитрий Соколов','kinozritel_77','Ольга В.','Никита','Анна Белова','Сергей П.','vera.films','Артём Л.','Юлия Ш.','Илья Р.','Екатерина','Тимур А.'];
const RV_HI=['Давно не было настолько цельной работы. Ни одной провисающей сцены.','Пересматривал дважды, и второй раз зашло даже лучше — деталей там гораздо больше, чем кажется.','Тот случай, когда после титров сидишь молча минуту.','Ожидания были высокие, и они оправдались полностью.','Актёрский состав вытаскивает даже те моменты, где сценарий мог бы просесть.'];
const RV_MID=['Крепко сделано, но без откровений. Один раз посмотреть стоит.','Первая половина отличная, ко второй немного выдыхается.','Хорошее кино на вечер. Не шедевр, но время потрачено не зря.','Визуально очень красиво, по содержанию местами предсказуемо.'];
const RV_LO=['Идея была хорошая, реализация подвела.','Затянуто. К середине начал отвлекаться.','Красивая картинка и пустота внутри.'];
function genReviews(f){
  const r=rng((f.id||'x')+'rv'); const base=f.kp||f.tm||f.im||6.8; const out=[]; const used=new Set();
  for(let i=0;i<3;i++){
    const sc=clamp(Math.round(base+(r()*3-1.4)),1,10);
    let a=pick(RV_A,r),guard=0; while(used.has(a)&&guard++<20)a=pick(RV_A,r); used.add(a);
    out.push({a,s:'офлайн-режим',sc,t:pick(sc>=8?RV_HI:sc>=6?RV_MID:RV_LO,r)});
  }
  return out;
}

let libTab='later', libView='';
/* Библиотека: три списка рядами с горизонтальной прокруткой, каждый
   разворачивается в сетку. Так уведомления видно сразу, без долгой прокрутки. */
const LIBOPEN={};
function libList(me,k){

    .sort((a,b)=>me.ratings[b.id]-me.ratings[a.id]);

}
function libSection(me,k,title,hint){
  const items=libList(me,k), open=!!LIBOPEN[k];
  const note=f=>k==='rated'?'Оценка: '+me.ratings[f.id]:'';
  if(!items.length) return `<section class="sec" id="lib-${k}">

const ONB={step:0,name:'',emoji:'',color:'',fav:[],seen:{},liked:{},pool:null,loading:false};
function onbInit(){
  if(ONB.emoji) return;

}
async function onbPool(){
  if(ONB.pool||ONB.loading) return;
  ONB.loading=true;
  let list=[];
  try{
    const pages=await Promise.all([1,2].map(page=>api('/discover/movie',
      {sort_by:'popularity.desc','vote_count.gte':3000,'vote_average.gte':6.8,
       'primary_release_date.gte':shiftDate(-240),page},60*48).catch(()=>null)));
    list=pages.filter(Boolean).flatMap(d=>mapList(d,'movie'));
  }catch(e){}
  if(list.length<12) list=OFF.filter(f=>f.kp>=7.6).map(offItem);
  const seen=new Set(); 
  ONB.pool=reg(list).filter(f=>{ if(seen.has(f.t)) return false; seen.add(f.t); return true }).slice(0,30);
  ONB.loading=false;
  if(route.v==='onboard') softRender();
}
const ONB_STEPS=['Знакомство','Жанры','Что смотрели','Что понравилось','Готово'];

  const h=$('.onb-hint'); if(!h) return;
  h.textContent = ONB.step===1
    ? (ONB.fav.length?'Выбрано: '+ONB.fav.length:'Можно и пропустить — тогда подстроимся по оценкам')
    : ONB.step===2
    ? (onbCount(ONB.seen)?'Отмечено: '+onbCount(ONB.seen):'Ничего не выбрали — тоже нормально')
    : (onbCount(ONB.liked)?'Понравилось: '+onbCount(ONB.liked):'Можно никого не отмечать');
  const b=$('[data-onb="next"]');
  if(b&&ONB.step===2) b.textContent=onbCount(ONB.seen)?'Дальше':'Пропустить';
  if(b&&ONB.step===1) b.textContent=ONB.fav.length?'Дальше':'Пропустить';
}

function onbFinish(){

async function loadPerson(id){
  const x=byPid(id); if(!x||PERSON[id]) return;
  const w=affinity(x);
  const ids=Object.entries(w).filter(([,v])=>v>0.4).sort((a,b)=>b[1]-a[1])
    .slice(0,3).map(([g])=>gidOf(g,'movie')).filter(Boolean);
  let list=[];
  try{
    const d=await api('/discover/movie',{with_genres:ids.join(','),sort_by:'popularity.desc',
      'vote_count.gte':200,'vote_average.gte':6.3,'primary_release_date.gte':shiftDate(-72)},60*12);
    const skip=new Set([].concat(x.lists.seen||[],Object.keys(x.ratings||{})));
    list=reg(mapList(d,'movie')).filter(f=>!skip.has(f.id))
      .map(f=>({f,s:recScore(f,w,x)})).sort((a,b)=>b.s-a.s).map(o=>o.f).slice(0,20);
  }catch(e){ list=OFF.filter(f=>f.kp>=7.8).map(offItem).slice(0,20) }
  PERSON[id]=list;
  const el=$('#row-precs');
  if(el&&route.v==='person'&&route.id===id){
    el.outerHTML=rowHTML('Что советуем '+x.name.replace(/а$/,'е'),list,{id:'precs',note:'подобрано по вкусам '+x.name});
    hydrate();
  }
}

const KPTEST={ok:false,txt:''};
async function kpSelfTest(){
  KPTEST.txt='проверяем…'; KPTEST.ok=false; softRender();
  try{
    const m=await kpdev('/v1.4/movie',{'externalId.imdb':'tt0111161',limit:1,
      selectFields:['id','name','rating','ageRating']});
    const doc=m&&m.docs&&m.docs[0];
    if(!doc){ KPTEST.txt='фильм не найден — проверьте токен'; KPTEST.ok=false; softRender(); return }
    const rv=await kpdev('/v1.4/review',{movieId:doc.id,limit:5,sortField:'date',sortType:-1});
    const n=rv?((rv.docs||[]).length):-1;
    KPTEST.ok=!!doc&&n>0;
    KPTEST.txt = n>0
      ? `рейтинг ${doc.rating&&doc.rating.kp||'—'}, отзывов ${rv.total||n} — всё работает`
      : (n===0 ? 'рейтинги приходят, а отзывы — нет: скорее всего этот раздел не входит в бесплатный тариф'
               : 'рейтинги приходят, запрос отзывов не прошёл');
  }catch(e){ KPTEST.ok=false; KPTEST.txt='нет связи с Кинопоиском' }
  softRender();
}
/* Состояние обновления приложения: что за сборка живёт на сервере */
const MYBUILD=(document.querySelector('meta[name="km-build"]')||{}).content||'';
const UPD={build:'',at:0,busy:false,msg:'',ok:false,checked:false,stale:false};
async function updInfo(){
  const base=syncBase(); if(!base) return;
  try{ const r=await fetch(base+'/api/version'); const j=await r.json();
    UPD.build=j.build||''; UPD.at=j.at||0; UPD.checked=true;
    /* на сервере лежит другая сборка — значит у нас на руках старая */
    UPD.stale=!!(UPD.build&&MYBUILD&&UPD.build!==MYBUILD);
    if(UPD.stale&&!$('.upd-bar')) updBar();
    if(route.v==='settings') softRender();
  }catch(e){}
}
/* Ненавязчивая полоска внизу: вышла новая версия, можно обновиться одним нажатием */
function updBar(){
  const el=document.createElement('div');
  el.className='upd-bar';
  el.innerHTML=`<span>Вышла новая версия приложения</span>
    <button class="btn btn-sm btn-p" data-reload>Обновить</button>
    <button class="upd-x" data-updclose>${ic('x')}</button>`;
  document.body.appendChild(el);
}
function hardReload(){
  const go=()=>location.reload(true);
  if('caches' in window) caches.keys().then(ks=>Promise.all(ks.map(k=>caches.delete(k)))).then(go).catch(go);
  else go();
}
async function updPull(){
  const base=syncBase(); if(!base||UPD.busy) return;
  UPD.busy=true; UPD.msg=''; softRender();
  try{
    const r=await fetch(base+'/api/pull');
    const j=await r.json();
    if(j.ok&&!MYBUILD){ UPD.ok=false;
      UPD.msg='Не могу сравнить версии: у этой сборки нет отпечатка. Обновите приложение с компьютера.' }
    else if(j.ok&&j.skipped&&j.build===MYBUILD){ UPD.ok=true; UPD.msg='У вас уже последняя версия' }
    else if(j.ok&&j.skipped){ UPD.ok=true; UPD.msg='Свежая версия есть на сервере — перезагружаем…';
      UPD.build=j.build||UPD.build; setTimeout(hardReload,900) }
    else if(j.ok){ UPD.ok=true; UPD.msg='Новая версия приехала — перезагружаем…';
      UPD.build=j.build||UPD.build; setTimeout(hardReload,900) }
    else { UPD.ok=false; UPD.msg=j.error||'Не удалось проверить' }
  }catch(e){ UPD.ok=false; UPD.msg='Нет связи с сервером' }
  UPD.busy=false; softRender();
}

/* ================================================================ ИМПОРТ СПИСКА
   Пользователь вставляет заметку вида
       ✅ Оппенгеймер
       - Дюна (2021)
       Интерстеллар — смотрели
   Разбираем построчно, ищем каждый фильм в базе и раскладываем по спискам. */
const IMP={step:'paste',text:'',rows:[],busy:false,done:0,total:0,who:'',ai:false};
const SEEN_MARK=/[✅✔️✓☑️☑✔🟢👀]/u;
function parseList(text){
  const stop=/^(фильмы|сериалы|кино|посмотреть|к просмотру|хочу посмотреть|список|watchlist|watched|просмотрено|смотреть позже)\s*[:：]?\s*$/i;
  return String(text||'').split(/\r?\n/).map(raw=>{
    let t=raw.trim();
    if(!t) return null;
    let seen=false;
    if(SEEN_MARK.test(t)) seen=true;
    if(/^\s*[-*•]?\s*\[\s*[xXхХvV✓✔]\s*\]/.test(t)) seen=true;
    if(/^\s*\+\s+/.test(t)) seen=true;
    if(/\(?\s*(смотрел[аи]?|просмотрен[оаы]|видел[аи]?|watched|seen|done)\s*\)?\s*$/i.test(t)) seen=true;
    t=t.replace(new RegExp(SEEN_MARK.source,'gu'),' ')
       .replace(/^\s*[-*•–—]\s*/,'')
       .replace(/^\[\s*[xXхХvV✓✔]?\s*\]\s*/,'')
       .replace(/^\s*\+\s+/,'')
       .replace(/^\d+\s*[.)]\s*/,'')
       .replace(/\(?\s*(смотрел[аи]?|просмотрен[оаы]|видел[аи]?|watched|seen|done)\s*\)?\s*$/i,'')
       .replace(/["«»„“”]/g,'')
       .trim();
    let year=0;
    const ym=t.match(/[(\[]?((?:19|20)\d{2})[)\]]?\s*$/);
    if(ym){ year=+ym[1]; t=t.slice(0,ym.index).trim() }
    t=t.replace(/[\s—–\-•,;:]+$/,'').trim();
    if(!t||t.length<2) return null;
    if(stop.test(t)) return null;
    if(/^\d+$/.test(t)) return null;
    return {raw:raw.trim(),q:t,year,want:seen?'seen':'later',rate:0,hit:null,state:'wait'};
  }).filter(Boolean).slice(0,200);
}
/* ------------------------------------------------------- умный разбор заметки
   Обычный разбор строчка-в-строчку не умеет ни исправлять опечатки, ни понимать
   «все фильмы такой-то». Поэтому сначала спрашиваем модель, а если её нет или
   она ответила невнятно — работает прежний разбор по галочкам. */
function noteChunks(text,size){
  size=size||22;
  const SEC=[
    [/(просмотрен|смотрел|смотрен|видел|watched|уже\s|посмотрел)/i,'seen'],
    [/(хочу|посмотреть|к просмотру|в планах|планы|watchlist|буду смотреть)/i,'later'],
    [/(не понравил|не зашл|разочаров|худш)/i,'bad'],
    [/(понравил|любим|лучш|топ|favou?rite)/i,'good']
  ];
  const out=[]; let cur=null, sec='';
  String(text||'').split(/\r?\n/).forEach(raw=>{
    const l=raw.trim();
    if(!l) return;
    /* заголовок раздела: короткая строка с двоеточием или в одиночестве */
    const bare=l.replace(/[«»"'*_#—–-]/g,'').trim();
    if(bare.length<=42&&(/[:：]\s*$/.test(l)||/^[A-ZА-Я\s]{4,}$/.test(bare))){
      const hit=SEC.find(([re])=>re.test(bare));
      if(hit){ sec=hit[1]; cur=null; return }
    }
    if(!cur||cur.lines.length>=size){ cur={sec,lines:[]}; out.push(cur) }
    cur.lines.push(l);
  });
  return out.filter(c=>c.lines.length);
}
const SEC_HINT={seen:'Все строки этого куска идут под заголовком «Просмотрено» — по умолчанию want="seen".',
  later:'Все строки этого куска идут под заголовком «Хочу посмотреть» — по умолчанию want="later".',
  bad:'Все строки этого куска идут под заголовком «Не понравилось» — want="seen", rating 3–4.',
  good:'Все строки этого куска идут под заголовком «Понравилось» — want="seen", rating 8–9.'};

const IMP_SYS='Ты приводишь в порядок чужой список фильмов — рукописный, с опечатками, '+
  'сокращениями, пометками и зачёркиваниями. Ты хорошо знаешь мировое и российское кино '+
  'и узнаёшь фильм даже по искажённому названию. Отвечай ТОЛЬКО валидным JSON, без пояснений.';

function impPrompt(chunk){
  return [
    'Вот кусок личного списка фильмов.',
    chunk.sec?SEC_HINT[chunk.sec]:'',
    '"""',chunk.lines.join('\n'),'"""',
    '',
    'Для каждой строки верни объект:',
    '- title — как фильм называется на самом деле. ОБЯЗАТЕЛЬНО исправь опечатки и искажения.',
    '  Примеры: «Дневник Бритни Джонс» → «Дневник Бриджит Джонс»; «Интерстелар» → «Интерстеллар»;',
    '  «Волк с уолстрит» → «Волк с Уолл-стрит»; «Крёстный отец 2» → «Крёстный отец 2».',
    '  Если строка — обрывок или разговорное название, восстанови настоящее.',
    '- original — оригинальное название латиницей (для российских фильмов — тоже латиницей).',
    '- year — год выпуска, если знаешь. Если не уверен — 0.',
    '- want — "seen" или "later".',
    '  "seen", если рядом галочка ✅ ✔ ☑ ✓, крестик [x], плюс, слова «смотрел», «смотрела»,',
    '  «просмотрено», «видел», «есть», «ок», «done», зачёркнутый текст (~~так~~ или text̶),',
    '  или если раздел это подразумевает. Иначе "later".',
    '- rating — 1..10, если из пометки понятно отношение человека. Зачёркнуто, «не понравилось»,',
    '  «фигня», «ужас», «не зашло», «бросил» → 3. «!», «!!!», «топ», «шедевр», «супер»,',
    '  «очень понравилось», «пересматривал» → 9. Если непонятно — не указывай поле вообще.',
    '- note — заметка человека из этой строки, если была (в скобках, после тире, после «—»).',
    '',
    'Особые случаи:',
    '1. Строки вида «все фильмы со Скарлетт Йоханссон», «фильмография Тарантино»,',
    '   «что-нибудь с Ди Каприо», «всё у Нолана» — это НЕ фильм. Положи их в people:',
    '   {"name":"Scarlett Johansson","role":"actor"|"director","want":"later"}.',
    '2. Если в одной строке несколько фильмов через запятую или слэш — раздели на несколько объектов.',
    '3. Заголовки разделов, даты, пустые пометки и строки без названия фильма пропусти.',
    '4. Не выдумывай фильмы, которых в списке нет.',
    '',
    'Формат: {"items":[{"title":"...","original":"...","year":2001,"want":"later","rating":9,"note":"..."}],',
    '"people":[{"name":"...","role":"actor","want":"later"}]}'
  ].filter(Boolean).join('\n');
}
async function aiParseChunk(chunk){
  const d=await aiJson([{role:'system',content:IMP_SYS},{role:'user',content:impPrompt(chunk)}],
    {temperature:0.15,max_tokens:2000,timeout:75});
  if(!d) return null;
  const def=chunk.sec==='later'?'later':(chunk.sec?'seen':'later');
  const items=(d.items||[]).map(x=>{
    const q=String(x.original||x.title||'').trim();
    if(!q) return null;
    const r=parseInt(x.rating,10);
    return {raw:String(x.title||q),q,alt:String(x.title||'').trim(),
      year:parseInt(x.year,10)||0,
      want:x.want==='seen'?'seen':(x.want==='later'?'later':def),
      rate:(r>=1&&r<=10)?r:0, note:String(x.note||'').slice(0,80),
      hit:null,state:'wait'};
  }).filter(Boolean);
  const people=(d.people||[]).map(x=>({name:String(x.name||'').trim(),
    role:x.role==='director'?'director':'actor',
    want:x.want==='seen'?'seen':'later'})).filter(x=>x.name);
  return {items,people};
}
/* Список рвём на куски: одним запросом модель не осилит сотню строк —
   ответ обрывается, и раньше всё молча падало на простой разбор по галочкам. */
async function aiParseList(text){
  const chunks=noteChunks(text);
  if(!chunks.length) return null;
  const res=new Array(chunks.length).fill(null);
  let idx=0, done=0;
  IMP.total=chunks.length; IMP.done=0;
  const work=async()=>{
    while(idx<chunks.length){
      const my=idx++;
      res[my]=await aiParseChunk(chunks[my]).catch(()=>null);
      done++; IMP.done=done;
      const el=$('#imp-prog'); if(el) el.style.width=Math.round(done/chunks.length*100)+'%';
      const n=$('#imp-cnt'); if(n) n.textContent='разобрано '+done+' из '+chunks.length;
    }
  };
  await Promise.all([work(),work(),work()]);
  const ok=res.filter(Boolean);
  if(!ok.length) return null;
  const items=[].concat(...ok.map(x=>x.items));
  const people=[].concat(...ok.map(x=>x.people));
  return {items,people,parts:ok.length,of:chunks.length};
}
/* «все фильмы такой-то» → реальная фильмография из TMDB, по популярности */
async function personRows(name,want,role){
  const sr=await api('/search/person',{query:name,include_adult:false,page:1},60*24*30).catch(()=>null);
  const per=((sr&&sr.results)||[])[0];
  if(!per) return [];
  const cr=await api(`/person/${per.id}/movie_credits`,{},60*24*7).catch(()=>null);
  const pool=role==='director'
    ? ((cr&&cr.crew)||[]).filter(x=>x.job==='Director')
    : ((cr&&cr.cast)||[]);
  const list=pool.filter(x=>x.poster_path&&(x.vote_count||0)>=40)
    .filter((x,i,a2)=>a2.findIndex(y=>y.id===x.id)===i)
    .sort((a2,b2)=>(b2.vote_count||0)-(a2.vote_count||0)).slice(0,14);
  return list.map(x=>{
    const hit=mapItem(x,'movie');
    if(!hit) return null;
    reg([hit]);
    return {raw:per.name+' — '+hit.t,q:hit.t,year:hit.y,want,hit,state:'ok',from:per.name,rate:0};
  }).filter(Boolean);
}
async function impStart(){
  const base=parseList(IMP.text);
  IMP.rows=base; IMP.done=0; IMP.total=0; IMP.busy=true; IMP.ai=false; IMP.step='think'; importModal();
  let rows=base;
  if(aiOn()){
    const d=await aiParseList(IMP.text).catch(()=>null);
    /* берём разбор ИИ, даже если он справился не со всем: то, что он не осилил,
       дополняем строчками из обычного разбора — так ничего не теряется */
    if(d&&d.items&&d.items.length){
      IMP.ai=true;
      rows=d.items.slice();
      if(d.parts<d.of){
        const have=new Set(rows.map(r=>impKey(r.q)));
        base.forEach(r=>{ if(!have.has(impKey(r.q))) rows.push(r) });
      }
    }
    if(d&&d.people&&d.people.length){
      IMP.step='people'; IMP.who=d.people.map(x=>x.name).join(', '); importModal();
      const packs=await Promise.all(d.people.slice(0,4)
        .map(per=>personRows(per.name,per.want,per.role).catch(()=>[])));
      rows=rows.concat([].concat(...packs));
    }
  }
  /* без дублей: один и тот же фильм мог прийти и строкой, и из фильмографии */
  const seenQ=new Set();
  IMP.rows=rows.filter(r=>{ const k=(r.hit?r.hit.id:impKey(r.q))+'|'+(r.year||'');
    if(seenQ.has(k)) return false; seenQ.add(k); return true }).slice(0,200);
  IMP.busy=false;
  if(!IMP.rows.length){ IMP.step='paste'; importModal();
    toast('Не нашли ни одной строки с названием',false); return }
  impResolve();
}
const impKey=q=>String(q||'').toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');
/* насколько найденное похоже на то, что искали (по парам букв) */
function simil(a,b){
  a=impKey(a); b=impKey(b);
  if(!a||!b) return 0;
  if(a===b) return 1;
  if(a.includes(b)||b.includes(a)) return .9;
  const gram=x=>{const s=new Set();for(let i=0;i<x.length-1;i++)s.add(x.slice(i,i+2));return s};
  const A=gram(a),B=gram(b); let hit=0;
  A.forEach(g=>{if(B.has(g))hit++});
  return 2*hit/(A.size+B.size||1);
}
/* из выдачи берём не первое попавшееся, а самое похожее — с учётом года */
function pickBest(list,q,alt,year){
  let best=null,bs=-1;
  list.slice(0,10).forEach(r=>{
    const t=r.title||r.name||'', o=r.original_title||r.original_name||'';
    const y=parseInt(String(r.release_date||r.first_air_date||'').slice(0,4),10)||0;
    let s=Math.max(simil(q,t),simil(q,o),alt?Math.max(simil(alt,t),simil(alt,o)):0);
    if(year&&y){ const dy=Math.abs(y-year); s+= dy===0?.35:(dy<=1?.18:(dy<=3?0:-.3)) }
    s+=Math.min((r.vote_count||0)/200000,1)*0.08;
    if(s>bs){bs=s;best=r}
  });
  return bs>=0.34?best:null;
}

async function impResolve(){
  IMP.busy=true; IMP.done=0; IMP.step='match'; importModal();
  const queue=IMP.rows.slice();
  const worker=async()=>{
    while(queue.length){
      const row=queue.shift(); if(!row) break;
      if(row.hit){ row.state='ok'; IMP.done++; const e1=$('#imp-prog');
        if(e1) e1.style.width=Math.round(IMP.done/IMP.rows.length*100)+'%';
        const n1=$('#imp-cnt'); if(n1) n1.textContent=IMP.done+' из '+IMP.rows.length;
        continue }
      try{
        const tries=[row.q,row.alt&&row.alt!==row.q?row.alt:'',
          row.q.replace(/\([^)]*\)/g,'').replace(/[^\p{L}\p{N}\s:'-]/gu,' ').replace(/\s{2,}/g,' ').trim()]
          .filter((x,i,a)=>x&&a.indexOf(x)===i);
        let hit=null;
        for(const q of tries){
          const d=await api('/search/multi',{query:q,include_adult:false,page:1},60*24*7);
          const list=(d.results||[]).filter(r=>r.media_type!=='person');
          const pick=pickBest(list,q,row.alt,row.year)||(tries.indexOf(q)===tries.length-1?list[0]:null);
          if(pick){ hit=mapItem(pick); if(hit) break }
        }
        if(hit){ reg([hit]); row.hit=hit; row.state='ok' } else { row.state='miss'; row.want='skip' }
      }catch(e){ row.state='miss'; row.want='skip' }
      IMP.done++;
      const el=$('#imp-prog'); if(el) el.style.width=Math.round(IMP.done/IMP.rows.length*100)+'%';
      const n=$('#imp-cnt'); if(n) n.textContent=IMP.done+' из '+IMP.rows.length;
    }
  };
  await Promise.all([worker(),worker(),worker(),worker(),worker(),worker()]);
  /* второй заход: то, что не нашлось, показываем модели ещё раз — уже точечно */
  const miss=IMP.rows.filter(r=>r.state==='miss');
  if(aiOn()&&miss.length){
    IMP.step='repair'; IMP.done=0; IMP.total=miss.length; importModal();
    await impRepair(miss);
  }
  IMP.busy=false; IMP.step='review'; importModal();
}
/* Точечная починка: спрашиваем только про непонятые строки, пачками по 20 */
async function impRepair(miss){
  const packs=[];
  for(let i=0;i<miss.length;i+=20) packs.push(miss.slice(i,i+20));
  for(const pack of packs){
    const d=await aiJson([
      {role:'system',content:IMP_SYS},
      {role:'user',content:'Эти строки из списка фильмов не нашлись в базе TMDB. '+
        'Скорее всего в них опечатки, сокращения или разговорные названия.\n\n'+
        pack.map((r,i)=>(i+1)+'. '+r.raw).join('\n')+
        '\n\nДля каждой строки определи настоящий фильм: точное название и оригинал латиницей '+
        'и год. Если строка вообще не про кино — верни null в title.\n'+
        'Формат: {"items":[{"n":1,"title":"...","original":"...","year":2001}]}'}],
      {temperature:0.1,max_tokens:1600,timeout:75});
    const fix=(d&&d.items)||[];
    const jobs=fix.map(x=>async()=>{
      const row=pack[(parseInt(x.n,10)||0)-1];
      if(!row||!x.title) return;
      const q=String(x.original||x.title).trim();
      const yr=parseInt(x.year,10)||0;
      const r=await api('/search/multi',{query:q,include_adult:false,page:1},60*24*7).catch(()=>null);
      const list=((r&&r.results)||[]).filter(z=>z.media_type!=='person');
      const pick=pickBest(list,q,String(x.title||''),yr)||list[0];
      const hit=pick?mapItem(pick):null;
      if(hit){ reg([hit]); row.hit=hit; row.state='ok'; row.fixed=true;
        if(row.want==='skip') row.want='later' }
      IMP.done++;
      const el=$('#imp-prog'); if(el) el.style.width=Math.round(IMP.done/Math.max(1,IMP.total)*100)+'%';
      const n=$('#imp-cnt'); if(n) n.textContent='уточнили '+IMP.done+' из '+IMP.total;
    });
    const q2=jobs.slice();
    const w=async()=>{ while(q2.length){ const f=q2.shift(); await f().catch(()=>{}) } };
    await Promise.all([w(),w(),w(),w()]);
  }
}
function impApply(){
  const p=P(); let later=0, seen=0, rated=0;
  IMP.rows.forEach(r=>{
    if(!r.hit||r.want==='skip') return;
    remember(r.hit);
    if(r.want==='seen'){ if(!p.lists.seen.includes(r.hit.id)){p.lists.seen.push(r.hit.id);seen++} }
    else { if(!p.lists.later.includes(r.hit.id)){p.lists.later.push(r.hit.id);later++} }
    /* зачёркнуто или «не понравилось» — это тоже оценка, и она важна для рекомендаций */
    if(r.rate&&p.ratings[r.hit.id]===undefined){
      p.ratings[r.hit.id]=r.rate; rated++;
      if(!p.lists.seen.includes(r.hit.id)) p.lists.seen.push(r.hit.id);
    }
  });
  save();
  delete ROWDATA.you; delete ROWDATA.duo; YOU.page=1; YOU.done=false; YOU.empty=0;
  closeModal();
  toast('Добавлено: «позже» '+later+', просмотрено '+seen+(rated?', с оценкой '+rated:''));
  IMP.step='paste'; IMP.text=''; IMP.rows=[];
  go('library'); render();
}

/* Названия проверяем по TMDB пачкой, а не по очереди */
async function resolveTitles(list,opts){
  opts=opts||{};
  const out=[], seen=new Set();
  const one=async x=>{
    const q=String(x.original||x.title||'').trim(); if(!q) return null;
    const yr=parseInt(x.year,10)||0;
    const r=await api('/search/multi',{query:q,include_adult:false,page:1},60*24*30).catch(()=>null);
    let l=((r&&r.results)||[]).filter(z=>z.media_type!=='person');
    if(opts.mt&&opts.mt!=='all') l=l.filter(z=>(z.media_type||'movie')===(opts.mt==='tv'?'tv':'movie'));
    if(yr) l.sort((a,b)=>{
      const ya=parseInt(String(a.release_date||a.first_air_date||'').slice(0,4),10)||0;
      const yb=parseInt(String(b.release_date||b.first_air_date||'').slice(0,4),10)||0;
      return Math.abs(ya-yr)-Math.abs(yb-yr);
    });
    const hit=l[0]?mapItem(l[0]):null;
    if(!hit) return null;
    if(yr&&hit.y&&Math.abs(hit.y-yr)>2) return null;
    return {hit,why:String(x.why||'').slice(0,120)};
  };
  const queue=list.slice();
  const work=async()=>{ while(queue.length){ const x=queue.shift();
    const r=await one(x).catch(()=>null);
    if(r&&!seen.has(r.hit.id)){ seen.add(r.hit.id); out.push(r) } } };
  await Promise.all([work(),work(),work(),work(),work(),work()]);
  return out;
}

      ].filter(Boolean).join('\n')}],
      {temperature:1.05,max_tokens:1800,timeout:70});
    const films=(d&&d.films)||[];

    const p2=P();

    const add=[];
    found.forEach(({hit,why})=>{
      if((p2.lists.seen||[]).includes(hit.id)||p2.ratings[hit.id]!==undefined) return;
      if(isHidden(p2,hit)) return;
      if((hit.votes||0)>250000) return;              /* «удиви» — не место для хитов */
      if(!genreFit(p2,hit,false)) return;            /* удивлять надо в его жанрах */
      if(box.items.some(z=>z.f&&z.f.id===hit.id)) return;
      AIW[hit.id]={ai:true,why};
      reg([hit]);

function surWarm(){

    if(!x.f) return null;

function surpriseDraw(keep){
  const p=P();
  const seenFr=seenFrMap(p);
  const skip=new Set([].concat(p.lists.seen||[],Object.keys(p.ratings||{})));
  const fresh=f=>f&&!skip.has(f.id)&&!isHidden(p,f)&&!surShown.has(f.id);
  const w=affinity(p);
  const rank=l=>l.filter(fresh)
    .filter(f=>{const k=frKey(f); return !k||!seenFr[k]})       /* серии, которые он знает, — мимо */
    .map(f=>({f,s:recScore(f,w,p,{nov:1.3,seenFr})+Math.random()*2.2}))
    .sort((a,b)=>b.s-a.s).map(o=>o.f);
  const ai=rank(surCached()), rest=rank(surPool);
  const isTv=f=>f.mt==='tv';
  const take=(want,tv)=>{
    const out=[];
    const from=l=>{ for(let i=0;i<l.length&&out.length<want;i++){
      if(isTv(l[i])===tv&&out.indexOf(l[i])<0){ out.push(l[i]); l.splice(i,1); i-- } } };
    from(ai); from(rest);          /* сначала находки ИИ, потом редкое из базы */
    return out;
  };
  let picks=[];
  if(keep&&surPicks.length){
    /* повторная отрисовка того же экрана: что уже показали — не выкидываем */
    const has=new Set(surPicks.map(f=>f.id));
    [ai,rest].forEach(l=>{for(let i=l.length-1;i>=0;i--) if(has.has(l[i].id)) l.splice(i,1)});
    picks=surPicks.slice();
    const needM=SUR_MOVIES-picks.filter(f=>!isTv(f)).length;
    const needT=SUR_TV-picks.filter(isTv).length;
    if(needM>0) picks=picks.concat(take(needM,false));
    if(needT>0) picks=picks.concat(take(needT,true));
  } else {
    picks=take(SUR_MOVIES,false).concat(take(SUR_TV,true));
  }
  surPicks=picks.slice();
  picks.forEach(f=>surShown.add(f.id));
  renderSurprise(false,picks);
}

const PTR={y0:0,on:false,dist:0,busy:false};
function ptrEl(){ let e=$('#ptr'); if(!e){ e=document.createElement('div'); e.id='ptr';
    e.innerHTML='<span class="ptr-c"></span>'; document.body.appendChild(e) } return e }
function ptrSet(d,spin){
  const e=ptrEl();
  e.style.transform='translate(-50%,'+Math.round(d)+'px)';
  e.style.opacity=d>6?Math.min(1,d/56):0;
  e.classList.toggle('ready',d>=64);
  e.classList.toggle('spin',!!spin);
  e.querySelector('.ptr-c').style.transform='rotate('+Math.round(d*3.4)+'deg)';
}
async function ptrRun(){
  if(PTR.busy) return;
  PTR.busy=true; ptrSet(70,true);
  try{
    CACHE={}; cacheSave();
    Object.keys(ROWDATA).forEach(k=>delete ROWDATA[k]);
    Object.keys(DETAIL).forEach(k=>delete DETAIL[k]);
    Object.keys(PERSON).forEach(k=>delete PERSON[k]);
    HERO.list=[]; YOU.page=1; YOU.done=false; YOU.empty=0; netFails=0; setOffline(false);
    if(syncOn()) await syncNow(false);
    render();
    await new Promise(r=>setTimeout(r,450));
  }catch(e){}
  ptrSet(0,false); PTR.busy=false; PTR.dist=0;
}
document.addEventListener('touchstart',e=>{
  if(PTR.busy||$('.ov')||window.scrollY>2||e.touches.length!==1) return;
  PTR.y0=e.touches[0].clientY; PTR.on=true; PTR.dist=0;
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!PTR.on||PTR.busy) return;
  if(window.scrollY>2){ PTR.on=false; ptrSet(0); return }
  const d=e.touches[0].clientY-PTR.y0;
  if(d<=0){ PTR.dist=0; ptrSet(0); return }
  PTR.dist=Math.min(d*0.55,96);
  ptrSet(PTR.dist);
},{passive:true});
document.addEventListener('touchend',()=>{
  if(!PTR.on||PTR.busy) return;
  PTR.on=false;
  if(PTR.dist>=64) ptrRun(); else { ptrSet(0); PTR.dist=0 }
},{passive:true});

document.addEventListener('touchmove',e=>{
  if(!SW.on) return;
  const t=e.touches[0], dx=t.clientX-SW.x0, dy=Math.abs(t.clientY-SW.y0);
  if(dy>Math.abs(dx)+20){ SW.on=false; swSet(0); return }
  SW.dx=Math.max(0,dx); swSet(SW.dx);
},{passive:true});
document.addEventListener('touchend',()=>{
  if(!SW.on) return;
  SW.on=false; const go_=SW.dx>=72; SW.dx=0; swSet(0);
  if(go_) history.back();
},{passive:true});

});
window.addEventListener('focus',()=>{ if(syncOn()&&Date.now()-(DB.sync.at||0)>60000) syncNow(false) });
if('serviceWorker' in navigator && (location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname))){
  navigator.serviceWorker.register('./sw.js').then(reg=>{
    if(!reg) return;
    reg.addEventListener('updatefound',()=>{
      const w=reg.installing; if(!w) return;
      w.addEventListener('statechange',()=>{
        if(w.state==='installed'&&navigator.serviceWorker.controller){
          toast('Вышло обновление — потяните вниз, чтобы применить');
          w.postMessage('skipWaiting');
        }
      });
    });
  }).catch(()=>{});
}
