<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#07080C">
<meta name="km-build" content="b581ff4e7dc4">
<meta name="description" content="KinoMind — поиск лучших фильмов и сериалов по рейтингам Кинопоиска и IMDb, умные рекомендации, свои списки и профили для всей семьи.">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>KinoMind — что посмотреть сегодня</title>

<link rel="dns-prefetch" href="https://i.ytimg.com">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF5F45'/%3E%3Cpath d='M8 7h4.2v7.6L18.8 7H24l-7.1 8.2L24.5 25h-5.1l-5.4-8.2-1.8 2V25H8z' fill='%23160B06'/%3E%3C/svg%3E">
<style>/* ============================ KinoMind — дизайн-система ============================ */
:root{
  --bg:#07080C; --bg-2:#0B0D13; --bg-3:#11141C;
  --card:rgba(255,255,255,.048); --card-2:rgba(255,255,255,.075);
  --stroke:rgba(255,255,255,.085); --stroke-2:rgba(255,255,255,.16);
  --txt:#F2F4F9; --muted:#9AA0B2; --dim:#666D80;
  --a1:#FF5F45; --a2:#FFB03C; --violet:#8B5CF6; --mint:#3ED9A4;
  --kp:#FF6B00; --imdb:#F5C518;
  --grad:linear-gradient(115deg,var(--a1),var(--a2));
  --r-s:10px; --r-m:16px; --r-l:22px; --r-xl:30px;
  --sh:0 18px 46px -18px rgba(0,0,0,.85);
  --nav-w:246px; --pad:clamp(16px,3.4vw,40px);
  --ease:cubic-bezier(.22,.9,.28,1);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--txt); overflow-x:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.5; letter-spacing:-.011em;
  font-feature-settings:"tnum" 0;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(900px 600px at 78% -8%,rgba(255,95,69,.16),transparent 62%),
    radial-gradient(760px 540px at 4% 6%,rgba(139,92,246,.15),transparent 60%),
    radial-gradient(900px 700px at 50% 108%,rgba(62,217,164,.07),transparent 62%);
}
img{display:block;max-width:100%}
svg{width:20px;height:20px;flex:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
::selection{background:rgba(255,95,69,.35)}
.scroll-x{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch}
.scroll-x::-webkit-scrollbar{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ============================ Каркас ============================ */
#app{position:relative;z-index:1;min-height:100%}
.shell{display:flex;min-height:100vh;min-height:100dvh}

/* ---- Сайдбар (десктоп) ---- */
.side{
  position:fixed;left:0;top:0;bottom:0;width:var(--nav-w);z-index:40;
  display:flex;flex-direction:column;gap:6px;padding:26px 16px 18px;
  background:linear-gradient(180deg,rgba(12,14,20,.94),rgba(8,9,13,.88));
  backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
  border-right:1px solid var(--stroke);
}
.logo{display:flex;align-items:center;gap:11px;padding:0 10px 22px;cursor:pointer}
.logo-m{
  width:38px;height:38px;border-radius:12px;background:var(--grad);flex:none;
  display:grid;place-items:center;box-shadow:0 8px 22px -8px rgba(255,95,69,.85);
}
.logo-m svg{width:21px;height:21px}
.logo-t{font-size:18px;font-weight:750;letter-spacing:-.03em}
.logo-t span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav-i{
  display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:13px;
  color:var(--muted);font-weight:560;font-size:14.5px;transition:.18s var(--ease);position:relative;
}
.nav-i svg{width:21px;height:21px;flex:none;stroke-width:1.7}
.nav-i:hover{color:var(--txt);background:var(--card)}
.nav-i.on{color:var(--txt);background:var(--card-2)}
.nav-i.on::before{content:"";position:absolute;left:-16px;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:0 3px 3px 0;background:var(--grad)}
.nav-badge{margin-left:auto;min-width:19px;height:19px;padding:0 6px;border-radius:9px;background:var(--a1);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.side-sp{flex:1}
.side-prof{
  display:flex;align-items:center;gap:10px;padding:10px;border-radius:15px;
  border:1px solid var(--stroke);background:var(--card);width:100%;text-align:left;transition:.18s
}
.side-prof:hover{background:var(--card-2);border-color:var(--stroke-2)}
.side-prof .nm{font-size:13.5px;font-weight:620;line-height:1.25}
.side-prof .sub{font-size:11.5px;color:var(--dim)}
.side-prof .chev{margin-left:auto;color:var(--dim)}
.ava{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;flex:none;background:var(--card-2);border:1px solid var(--stroke)}

/* ---- Главная область ---- */
.main{flex:1;min-width:0;margin-left:var(--nav-w);padding-bottom:80px}
.wrap{max-width:1420px;margin:0 auto;padding:0 var(--pad)}

/* ---- Верхняя панель (мобильная) ---- */
.topbar{display:none}

/* ---- Нижняя навигация (мобильная) ---- */
.tabbar{display:none}

/* ============================ Типографика ============================ */
h1,h2,h3,h4{margin:0;letter-spacing:-.03em;line-height:1.12;font-weight:720}
.h-page{font-size:clamp(26px,4.4vw,38px);font-weight:760;padding:30px 0 4px}
.sub-page{color:var(--muted);font-size:14.5px;margin:0 0 22px}
.sec{margin:38px 0 0}
.sec-h{display:flex;align-items:baseline;gap:12px;margin:0 0 15px}
.sec-t{font-size:clamp(18px,2.3vw,23px);font-weight:730}
.sec-n{font-size:13px;color:var(--dim);font-weight:500}
.sec-more{margin-left:auto;font-size:13px;color:var(--muted);font-weight:560;display:flex;align-items:center;gap:4px}
.sec-more:hover{color:var(--a2)}
/* «обновлено» — тихий знак, что подборка пересобралась под новые данные */
.sec-fresh{margin-left:auto;display:inline-flex;align-items:center;gap:5px;flex:none;
  padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.02em;
  color:#0B0E14;background:var(--grad);animation:freshIn .35s var(--ease), freshOut .5s 3.1s forwards}
.sec-fresh+.sec-more{margin-left:10px}
.sec-fresh svg{width:13px;height:13px}
@keyframes freshIn{from{opacity:0;transform:translateY(-4px) scale(.9)}to{opacity:1;transform:none}}
@keyframes freshOut{to{opacity:0;transform:translateY(-4px)}}

/* ============================ Кнопки, чипы ============================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 18px;border-radius:13px;font-size:14px;font-weight:620;
  border:1px solid var(--stroke);background:var(--card);color:var(--txt);
  transition:.18s var(--ease);white-space:nowrap
}
.btn svg{width:17px;height:17px;stroke-width:1.9;flex:none}
.btn:hover{background:var(--card-2);border-color:var(--stroke-2);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.985)}
.btn-p{background:var(--grad);border-color:transparent;color:#160B06;font-weight:700;box-shadow:0 12px 30px -12px rgba(255,120,60,.9)}
.btn-p:hover{background:var(--grad);filter:brightness(1.07)}
.btn-on{background:rgba(62,217,164,.16);border-color:rgba(62,217,164,.4);color:var(--mint)}
.btn-sm{padding:8px 13px;font-size:13px;border-radius:11px}
.btn-ic{width:40px;height:40px;padding:0;border-radius:12px}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:11px;
  font-size:13px;font-weight:560;color:var(--muted);border:1px solid var(--stroke);
  background:var(--card);transition:.16s var(--ease);white-space:nowrap
}
.chip:hover{color:var(--txt);border-color:var(--stroke-2)}
.chip.on{background:rgba(255,95,69,.15);border-color:rgba(255,140,80,.45);color:#FFCBA8}
.chip-x{padding:6px 11px;font-size:12px;border-radius:9px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips-x{flex-wrap:nowrap;gap:8px;padding-bottom:4px}

/* ============================ Рейтинги ============================ */
.rt{display:inline-flex;align-items:center;gap:5px;font-weight:730;font-size:13px;font-variant-numeric:tabular-nums}
.rt i{font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.06em;opacity:.75;text-transform:uppercase}
.rt.kp{color:#FF9147}
.rt.im{color:var(--imdb)}
.rt.tm{color:#5FD9C0}
.rt-b{
  display:inline-flex;flex-direction:column;align-items:center;gap:1px;
  padding:9px 14px;border-radius:13px;border:1px solid var(--stroke);background:var(--card);min-width:78px
}
.rt-b b{font-size:19px;font-weight:770;line-height:1;font-variant-numeric:tabular-nums}
.rt-b span{font-size:9.5px;font-weight:700;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
.rt-b.kp b{color:#FF9147} .rt-b.im b{color:var(--imdb)} .rt-b.tm b{color:#5FD9C0}
.rt-b.my b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ============================ Постер / карточка ============================ */
.card{display:block;width:100%;text-align:left;position:relative;transition:.22s var(--ease)}
.card:hover{transform:translateY(-4px)}
.poster{
  position:relative;aspect-ratio:2/3;border-radius:var(--r-m);overflow:hidden;
  background:var(--bg-3);border:1px solid var(--stroke);box-shadow:var(--sh)
}
.poster img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
.poster img.in{opacity:1}
.poster .ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:12px}
.poster .ph::after{
  content:"";position:absolute;inset:0;opacity:.5;mix-blend-mode:overlay;
  background-image:radial-gradient(rgba(255,255,255,.5) .6px,transparent .7px);background-size:3px 3px
}
.poster .ph b{
  position:absolute;top:-6%;left:50%;transform:translateX(-50%);font-size:9em;font-weight:800;
  color:rgba(255,255,255,.11);line-height:1;letter-spacing:-.06em;pointer-events:none
}
.poster .ph em{
  position:relative;font-style:normal;font-size:13px;font-weight:700;line-height:1.2;
  letter-spacing:-.02em;text-shadow:0 2px 12px rgba(0,0,0,.7);z-index:1;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden
}
.poster .glow{position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.55));opacity:0;transition:.25s}
.card:hover .poster .glow{opacity:1}
.poster .kpb{
  position:absolute;top:8px;left:8px;padding:4px 8px;border-radius:8px;font-size:11.5px;font-weight:750;
  background:rgba(8,9,13,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.14);font-variant-numeric:tabular-nums
}
.poster .kpb.hi{color:#4ADE80} .poster .kpb.mid{color:#FFC46B} .poster .kpb.lo{color:#F87171}
.poster .kpb i{font-style:normal;font-size:7.5px;font-weight:800;letter-spacing:.05em;opacity:.55;margin-left:3px;vertical-align:1px;text-transform:uppercase}
.poster .stb{
  position:absolute;top:8px;right:8px;padding:4px 8px;border-radius:8px;font-size:10px;font-weight:700;
  letter-spacing:.02em;background:rgba(8,9,13,.72);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14)
}
.poster .mk{
  position:absolute;bottom:8px;right:8px;width:26px;height:26px;border-radius:9px;display:grid;place-items:center;
  background:rgba(8,9,13,.78);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.16)
}
.poster .mk svg{width:14px;height:14px}
.c-t{margin:9px 2px 0;font-size:13.5px;font-weight:620;line-height:1.28;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-m{margin:3px 2px 0;font-size:12px;color:var(--dim);display:flex;gap:6px;align-items:center}
.c-m .dot{width:2.5px;height:2.5px;border-radius:50%;background:var(--dim);flex:none}

/* ---- Ряды / сетки ---- */
.row{position:relative}
.row-s{display:grid;grid-auto-flow:column;grid-auto-columns:142px;gap:14px;padding:2px 0 10px;scroll-snap-type:x proximity}
.row-s>*{scroll-snap-align:start}
.row-a{
  position:absolute;top:calc(50% - 42px);transform:translateY(-50%);width:38px;height:38px;border-radius:50%;z-index:5;
  display:none;place-items:center;background:rgba(12,14,20,.86);border:1px solid var(--stroke-2);
  backdrop-filter:blur(10px);transition:.18s;opacity:0
}
.row:hover .row-a{opacity:1}
.row-a:hover{background:var(--card-2);transform:translateY(-50%) scale(1.08)}
.row-a.l{left:-14px} .row-a.r{right:-14px}
.row-a svg{width:18px;height:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px 14px}

/* ============================ Хиро ============================ */
.hero{
  position:relative;border-radius:var(--r-xl);overflow:hidden;margin-top:22px;
  min-height:clamp(400px,52vw,520px);display:flex;align-items:flex-end;
  border:1px solid var(--stroke);box-shadow:0 30px 70px -30px rgba(0,0,0,.9)
}
.hero-bg{position:absolute;inset:0;transition:opacity .6s}
.hero-bg img{width:100%;height:100%;object-fit:cover}
.hero-bg::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(7,8,12,.97) 4%,rgba(7,8,12,.6) 42%,rgba(7,8,12,.15) 78%),
             linear-gradient(90deg,rgba(7,8,12,.9),transparent 62%)
}
.hero-c{position:relative;padding:clamp(22px,3.6vw,44px);max-width:640px;width:100%}
.hero-tag{
  display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:9px;margin-bottom:14px;
  font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  background:rgba(255,95,69,.18);border:1px solid rgba(255,140,80,.4);color:#FFC7AD
}
.hero-tag .pulse{width:6px;height:6px;border-radius:50%;background:var(--a1);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}
.hero-t{font-size:clamp(30px,5.6vw,54px);font-weight:790;letter-spacing:-.04em;line-height:1.02;margin:0 0 10px}
.hero-meta{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-bottom:12px;font-size:13.5px;color:var(--muted)}
.hero-d{font-size:14.5px;color:#C4CAD9;line-height:1.55;margin:0 0 20px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero-btns{display:flex;gap:10px;flex-wrap:wrap}
.hero-dots{position:absolute;bottom:18px;right:clamp(22px,3.6vw,44px);display:flex;gap:7px;z-index:3}
.hero-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.28);transition:.25s}
.hero-dot.on{width:22px;border-radius:4px;background:var(--grad)}

/* ============================ Удиви меня ============================ */
.surprise{
  display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:var(--r-l);margin-top:18px;
  border:1px solid rgba(255,140,80,.28);
  background:linear-gradient(100deg,rgba(255,95,69,.15),rgba(139,92,246,.13) 62%,rgba(255,176,60,.1));
  position:relative;overflow:hidden
}
.surprise::after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,150,80,.25),transparent 70%)}
.surprise-i{width:48px;height:48px;border-radius:15px;background:var(--grad);display:grid;place-items:center;flex:none;box-shadow:0 10px 26px -10px rgba(255,120,60,.9)}
.surprise-i svg{width:25px;height:25px}
.surprise-t{font-size:16px;font-weight:700;letter-spacing:-.02em}
.surprise-s{font-size:13px;color:var(--muted);margin-top:2px}
.surprise .btn{margin-left:auto;position:relative;z-index:1}

/* ============================ Поиск ============================ */
.search-bar{position:relative;margin:6px 0 16px}
.search-bar svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:var(--dim)}
.search-bar input{
  width:100%;padding:15px 46px 15px 46px;border-radius:16px;font-size:15.5px;
  background:var(--card);border:1px solid var(--stroke);outline:none;transition:.2s
}
.search-bar input:focus{border-color:rgba(255,140,80,.45);background:var(--card-2);box-shadow:0 0 0 4px rgba(255,95,69,.1)}
.search-bar input::placeholder{color:var(--dim)}
.search-clr{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--dim)}
.search-clr:hover{background:var(--card-2);color:var(--txt)}
.f-panel{border:1px solid var(--stroke);background:var(--card);border-radius:var(--r-l);padding:16px 18px;margin-bottom:18px}
.f-row{padding:13px 0;border-top:1px solid var(--stroke)}
.f-row:first-child{padding-top:0;border-top:0}
.f-lbl{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.f-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.f-cnt{padding:3px 8px;border-radius:7px;background:var(--a1);color:#fff;font-size:11px;font-weight:750}
.sl-wrap{display:flex;align-items:center;gap:14px}
.sl-v{min-width:52px;padding:5px 9px;border-radius:9px;background:var(--card-2);border:1px solid var(--stroke);font-size:13px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.sl-v.kp{color:#FF9147} .sl-v.im{color:var(--imdb)}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.12);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:19px;height:19px;border-radius:50%;background:#fff;border:3px solid var(--a1);cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:#fff;border:3px solid var(--a1);cursor:pointer}
.f-foot{display:flex;align-items:center;gap:10px;padding-top:13px;border-top:1px solid var(--stroke);flex-wrap:wrap}
.sel{padding:9px 13px;border-radius:11px;background:var(--card-2);border:1px solid var(--stroke);font-size:13px;font-weight:560;outline:none;cursor:pointer}
.sel option{background:var(--bg-3)}

/* ============================ Карточка фильма ============================ */
.det-back{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:14px 0;
  margin-bottom:-56px;pointer-events:none
}
.det-back .btn{pointer-events:auto;background:rgba(10,12,17,.7);backdrop-filter:blur(14px)}
.det-hero{position:relative;margin:0 calc(var(--pad)*-1);padding:0 var(--pad);min-height:clamp(300px,40vw,440px);display:flex;align-items:flex-end}
.det-hero-bg{position:absolute;inset:0;overflow:hidden}
.det-hero-bg img{width:100%;height:100%;object-fit:cover;filter:saturate(1.05)}
.det-hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 2%,rgba(7,8,12,.72) 45%,rgba(7,8,12,.35))}
.det-top{position:relative;display:flex;gap:clamp(16px,2.6vw,30px);width:100%;padding:26px 0 6px;align-items:flex-end}
.det-poster{width:clamp(112px,15vw,190px);flex:none}
.det-info{flex:1;min-width:0;padding-bottom:6px}
.det-t{font-size:clamp(25px,4.4vw,44px);font-weight:780;letter-spacing:-.035em;line-height:1.05;margin:0 0 6px}
.det-o{font-size:14px;color:var(--dim);margin:0 0 12px}
.det-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13.5px;color:var(--muted);margin-bottom:14px}
.det-ratings{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.det-acts{display:flex;flex-wrap:wrap;gap:9px}
.det-body{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:clamp(20px,3vw,42px);padding-top:26px}
.det-body>*{min-width:0}
.blk{margin-bottom:30px}
.blk-t{font-size:17px;font-weight:720;margin:0 0 13px;letter-spacing:-.02em}
.blk p{margin:0;color:#C7CCDA;line-height:1.66;font-size:14.8px}
.facts{display:flex;flex-direction:column;gap:0;border:1px solid var(--stroke);border-radius:var(--r-m);background:var(--card);overflow:hidden}
.fact{display:flex;gap:12px;padding:11px 15px;font-size:13.5px;border-top:1px solid var(--stroke)}
.fact:first-child{border-top:0}
.fact dt{color:var(--dim);min-width:104px;flex:none}
.fact dd{margin:0;font-weight:560}
.cast-row{display:grid;grid-auto-flow:column;grid-auto-columns:96px;gap:14px;padding-bottom:8px}
.cast-i{text-align:center}
.cast-a{width:80px;height:80px;border-radius:50%;margin:0 auto 9px;display:grid;place-items:center;font-size:23px;font-weight:700;color:rgba(255,255,255,.5);border:1px solid var(--stroke);position:relative;overflow:hidden}
.cast-a img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:.4s}
.cast-a img.in{opacity:1}
.cast-n{font-size:12.5px;font-weight:580;line-height:1.3}
.cast-r{font-size:11.5px;color:var(--dim);margin-top:2px}
.shots{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(210px,26vw,300px);gap:12px;padding-bottom:8px}
.shot{aspect-ratio:16/9;border-radius:var(--r-m);overflow:hidden;border:1px solid var(--stroke);position:relative;background:var(--bg-3)}
.shot img{width:100%;height:100%;object-fit:cover;opacity:0;transition:.5s}
.shot img.in{opacity:1}
.shot .ph{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.28);font-size:11px;font-weight:600;text-align:center;padding:12px}
.rev{border:1px solid var(--stroke);background:var(--card);border-radius:var(--r-m);padding:15px 17px;margin-bottom:11px}
.rev-h{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.rev-a{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.rev-n{font-size:13.5px;font-weight:640}
.rev-s{font-size:11.5px;color:var(--dim)}
.rev-sc{margin-left:auto;padding:4px 9px;border-radius:8px;font-size:12.5px;font-weight:730;font-variant-numeric:tabular-nums}
.rev-sc.pos{background:rgba(74,222,128,.14);color:#4ADE80}
.rev-sc.neu{background:rgba(255,196,107,.14);color:#FFC46B}
.rev-sc.neg{background:rgba(248,113,113,.14);color:#F87171}
.rev p{margin:0;font-size:14px;color:#BDC3D2;line-height:1.6;white-space:pre-line}
.rev-txt.cut{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.rev-more{margin-top:9px;font-size:12.5px;font-weight:620;color:var(--a2)}
.rev-more:hover{text-decoration:underline}

/* ---- скелетоны ---- */
@keyframes shim{100%{background-position:-200% 0}}
.sk,.sk-l{background:linear-gradient(90deg,rgba(255,255,255,.045) 25%,rgba(255,255,255,.09) 37%,rgba(255,255,255,.045) 63%);
  background-size:200% 100%;animation:shim 1.5s linear infinite;border-radius:var(--r-m)}
.sk-l{height:11px;margin:9px 2px 0;border-radius:6px;width:100%}
.poster.sk{border-color:transparent;box-shadow:none}
.hero.sk{border-color:transparent}
.cast-a.sk{border-color:transparent;border-radius:50%}
.shot.sk{border-color:transparent}
.rev.sk{border-color:transparent}

/* ---- кадры: увеличение ---- */
.shot{padding:0;display:block;cursor:zoom-in}
.shot .shot-z{position:absolute;right:9px;bottom:9px;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;
  background:rgba(8,9,13,.7);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.16);opacity:0;transition:.2s}
.shot:hover .shot-z{opacity:1}
.shot .shot-z svg{width:15px;height:15px}
.lb{position:relative;width:100%;max-width:1200px;display:flex;align-items:center;justify-content:center;animation:rise .28s var(--ease)}
.lb img{max-width:100%;max-height:82vh;border-radius:var(--r-m);box-shadow:0 30px 80px -20px rgba(0,0,0,.9)}
.lb-x{position:absolute;top:-46px;right:0;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:rgba(255,255,255,.08);border:1px solid var(--stroke-2)}
.lb-a{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:rgba(10,12,17,.75);border:1px solid var(--stroke-2);backdrop-filter:blur(10px)}
.lb-a:hover{background:rgba(30,34,44,.9)}
.lb-a.l{left:-8px} .lb-a.r{right:-8px}
.lb-n{position:absolute;bottom:-34px;left:50%;transform:translateX(-50%);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:860px){.lb-a.l{left:2px}.lb-a.r{right:2px}.lb-x{top:-42px}}

/* ---- трейлеры ---- */
.trailers{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(210px,26vw,270px);gap:12px;padding-bottom:8px}
.trailer{position:relative;aspect-ratio:16/9;border-radius:var(--r-m);overflow:hidden;border:1px solid var(--stroke);
  background:linear-gradient(150deg,#1B2030,#0D1017);display:block;padding:0;transition:.2s var(--ease)}
.trailer:hover{transform:translateY(-3px);border-color:var(--stroke-2)}
.trailer img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:.45s}
.trailer img.in{opacity:1}
.trailer .tr-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;
  display:grid;place-items:center;background:rgba(255,95,69,.92);box-shadow:0 10px 26px -8px rgba(0,0,0,.8)}
.trailer .tr-play svg{width:19px;height:19px;color:#160B06;margin-left:2px}
.trailer .tr-n{position:absolute;left:0;right:0;bottom:0;padding:22px 11px 9px;font-size:11.5px;font-weight:600;text-align:left;
  background:linear-gradient(0deg,rgba(6,7,11,.92),transparent);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.yt{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--r-m);overflow:hidden;background:#000;border:1px solid var(--stroke)}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* ---- «Кто смотрит» ---- */
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px}
.who-c{display:flex;flex-direction:column;align-items:center;gap:4px;padding:22px 14px 18px;border-radius:var(--r-l);
  border:1px solid var(--stroke);background:var(--card);transition:.2s var(--ease);position:relative;text-align:center}
.who-c:hover{transform:translateY(-3px);border-color:var(--stroke-2);background:var(--card-2)}
.who-c.on{border-color:rgba(255,140,80,.55);background:rgba(255,95,69,.09)}
.who-a{width:66px;height:66px;border-radius:22px;display:grid;place-items:center;font-size:31px;margin-bottom:10px;
  border:1px solid var(--stroke-2);color:var(--muted)}
.who-a svg{width:24px;height:24px}
.who-n{font-size:15.5px;font-weight:680;letter-spacing:-.02em}
.who-s{font-size:11.5px;color:var(--dim);line-height:1.35}
.who-b{position:absolute;top:10px;right:10px;padding:3px 8px;border-radius:7px;font-size:10px;font-weight:750;
  background:var(--grad);color:#170B05}
.who-add{border-style:dashed;color:var(--muted)}
.who-add:hover{color:var(--a2)}
.who-pill{display:flex;align-items:center;gap:7px;padding:5px 11px 5px 5px;border-radius:12px;
  border:1px solid var(--stroke);background:var(--card);max-width:150px}
.who-pill .who-e{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:15px;border:1px solid var(--stroke);flex:none}
.who-pill .who-t{font-size:12.5px;font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.guestbar{display:flex;align-items:center;gap:11px;padding:12px 16px;border-radius:var(--r-m);margin:16px 0 0;
  font-size:13.5px;color:#C8CEDD;background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.3);flex-wrap:wrap}
.guestbar svg{width:18px;height:18px;color:#B39CFF;flex:none}
.guestbar span{flex:1;min-width:180px}

/* ---- инструкция по шагам ---- */
.howto{margin:0;padding-left:20px;font-size:13.5px;color:#C2C8D8;line-height:1.75}
.howto li{margin-bottom:3px}
.howto b{color:var(--txt);font-weight:640}
.more-fld summary{cursor:pointer;font-size:12.5px;font-weight:620;color:var(--muted);padding:4px 0;list-style:none}
.more-fld summary::-webkit-details-marker{display:none}
.more-fld summary::before{content:"▸ ";color:var(--dim)}
.more-fld[open] summary::before{content:"▾ "}
.more-fld summary:hover{color:var(--txt)}

/* ---- подгрузка рекомендаций ---- */
.loadmore{display:flex;align-items:center;justify-content:center;gap:10px;padding:26px 0 8px;min-height:66px}
.lm-t{font-size:13.5px;color:var(--muted)}
.lm-end{font-size:13px;color:var(--dim)}
.lm-sp{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.12);border-top-color:var(--a1);
  animation:spin .8s linear infinite;flex:none}

/* ---- сегмент-переключатель в заголовке ряда ---- */
.seg{display:inline-flex;gap:3px;padding:3px;border-radius:12px;background:var(--card);border:1px solid var(--stroke);margin-left:auto}
.seg-b{padding:6px 12px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted);transition:.16s;white-space:nowrap}
.seg-b:hover{color:var(--txt)}
.seg-b.on{background:var(--card-2);color:var(--txt);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.sec-h .seg+.sec-more{margin-left:10px}

/* ---- синхронизация ---- */
.syncb{display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;margin-bottom:10px;border-radius:12px;
  border:1px solid var(--stroke);background:var(--card);font-size:12.5px;font-weight:580;color:var(--muted);transition:.18s}
.syncb:hover{border-color:var(--stroke-2);color:var(--txt)}
.syncb.ok{color:var(--mint);border-color:rgba(62,217,164,.28);background:rgba(62,217,164,.08)}
.syncb.err{color:#F87171;border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.08)}
.syncb.busy span{opacity:.8}
.syncb.busy{animation:pulse 1.4s ease-in-out infinite}
.famcode{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:var(--r-m);
  border:1px dashed var(--stroke-2);background:rgba(255,255,255,.03);flex-wrap:wrap}
.famcode .fc-l{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.famcode .fc-v{font-size:22px;font-weight:760;letter-spacing:.1em;font-variant-numeric:tabular-nums;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.famcode .btn{margin-left:auto}
@media (max-width:860px){
  .sec-h{flex-wrap:wrap}
  .seg{margin-left:auto}
  .syncb{position:fixed;left:auto;right:12px;bottom:calc(94px + var(--sab));width:auto;margin:0;z-index:44;
    background:rgba(14,16,22,.92);backdrop-filter:blur(16px);padding:8px 12px;border-radius:11px}
  .syncb span{display:none}
  .syncb.ok span,.syncb.err span{display:none}
}

/* ---- диагностика ---- */
.diag{border:1px solid var(--stroke);border-radius:var(--r-m);overflow:hidden;background:rgba(0,0,0,.2)}
.diag-h{padding:9px 14px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);
  background:rgba(255,255,255,.03);border-top:1px solid var(--stroke)}
.diag-h:first-child{border-top:0}
.diag-r{display:flex;align-items:center;gap:9px;padding:9px 14px;font-size:13px;border-top:1px solid var(--stroke);flex-wrap:wrap}
.diag-r .dot2{width:7px;height:7px;border-radius:50%;flex:none}
.diag-r.ok .dot2{background:var(--mint)} .diag-r.no .dot2{background:#F87171}
.diag-r .hn{font-weight:580}
.diag-r .hd{font-size:11.5px;color:var(--dim)}
.diag-r .hs{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.diag-r .hu{padding:2px 8px;border-radius:7px;font-size:10.5px;font-weight:700;background:rgba(62,217,164,.16);color:var(--mint)}

/* ---- офлайн-плашка ---- */
.offbar{display:none;align-items:center;gap:10px;padding:10px 16px;border-radius:14px;margin:14px 0 -6px;
  font-size:13px;font-weight:560;color:#FFC7AD;background:rgba(255,95,69,.12);border:1px solid rgba(255,140,80,.3)}
.offbar svg{width:17px;height:17px}
.note{font-size:12px;color:var(--dim);display:flex;gap:7px;align-items:flex-start;margin-top:10px;line-height:1.45}
.note svg{width:14px;height:14px;flex:none;margin-top:1px}

/* ---- Оценка звёздами ---- */
.stars{display:flex;gap:3px;flex-wrap:wrap}
.star{width:29px;height:29px;border-radius:9px;display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--dim);border:1px solid var(--stroke);background:var(--card);transition:.14s;font-variant-numeric:tabular-nums}
.star:hover{border-color:var(--stroke-2);color:var(--txt);transform:translateY(-2px)}
.star.on{background:var(--grad);border-color:transparent;color:#170B05}
.rate-box{border:1px solid var(--stroke);background:var(--card);border-radius:var(--r-m);padding:15px 17px}

/* ============================ Библиотека / профили ============================ */
.prof-row{display:flex;gap:11px;padding-bottom:6px;align-items:stretch}
.prof-c{
  display:flex;align-items:center;gap:10px;padding:10px 15px 10px 10px;border-radius:16px;
  border:1px solid var(--stroke);background:var(--card);transition:.18s var(--ease);white-space:nowrap
}
.prof-c:hover{border-color:var(--stroke-2);transform:translateY(-2px)}
.prof-c.on{border-color:rgba(255,140,80,.5);background:rgba(255,95,69,.1)}
.prof-c .nm{font-size:14px;font-weight:640}
.prof-c .sub{font-size:11.5px;color:var(--dim)}
.prof-add{display:grid;place-items:center;width:56px;border-radius:16px;border:1px dashed var(--stroke-2);color:var(--muted);transition:.18s}
.prof-add:hover{color:var(--a2);border-color:var(--a2)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:11px;margin:20px 0 6px}
.stat{padding:15px 17px;border-radius:var(--r-m);border:1px solid var(--stroke);background:var(--card)}
.stat b{display:block;font-size:26px;font-weight:770;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--dim);margin-top:5px;display:block}
.tabs{display:flex;gap:6px;padding:5px;border-radius:15px;background:var(--card);border:1px solid var(--stroke);margin:22px 0 20px;width:fit-content;max-width:100%;overflow-x:auto}
.tab{padding:9px 16px;border-radius:11px;font-size:13.5px;font-weight:600;color:var(--muted);transition:.16s;white-space:nowrap}
.tab:hover{color:var(--txt)}
.tab.on{background:var(--card-2);color:var(--txt);box-shadow:0 2px 10px rgba(0,0,0,.3)}
.tab .n{font-size:11px;opacity:.6;margin-left:5px}
.notif{display:flex;gap:13px;padding:14px 16px;border-radius:var(--r-m);border:1px solid var(--stroke);background:var(--card);margin-bottom:10px;align-items:flex-start;transition:.18s;width:100%;text-align:left}
.notif:hover{border-color:var(--stroke-2)}
.notif.unread{background:rgba(255,95,69,.07);border-color:rgba(255,140,80,.25)}
.notif-i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:17px}
.notif-t{display:block;font-size:14px;font-weight:600;line-height:1.35}
.notif-d{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.notif-w{display:block;font-size:11.5px;color:var(--dim);margin-top:5px}
.notif .dot{width:7px;height:7px;border-radius:50%;background:var(--a1);flex:none;margin-top:6px}

/* ============================ Пустые состояния ============================ */
.empty{text-align:center;padding:56px 20px;border:1px dashed var(--stroke-2);border-radius:var(--r-l);color:var(--muted)}
.empty-i{width:56px;height:56px;border-radius:18px;background:var(--card);display:grid;place-items:center;margin:0 auto 15px;font-size:25px}
.empty h4{font-size:16.5px;font-weight:680;color:var(--txt);margin:0 0 6px}
.empty p{margin:0 0 16px;font-size:13.5px;max-width:380px;margin-inline:auto;line-height:1.55}

/* ============================ Модалки ============================ */
.ov{
  position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;
  background:rgba(4,5,8,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:fade .22s
}
@keyframes fade{from{opacity:0}}
.modal{
  width:100%;max-width:520px;max-height:88vh;overflow-y:auto;border-radius:var(--r-xl);
  background:linear-gradient(165deg,#15181F,#0C0E14);border:1px solid var(--stroke-2);
  box-shadow:0 40px 90px -30px rgba(0,0,0,.95);animation:rise .3s var(--ease)
}
@keyframes rise{from{transform:translateY(26px) scale(.97);opacity:0}}
.modal-h{display:flex;align-items:center;gap:12px;padding:20px 22px 0}
.modal-h h3{font-size:19px;font-weight:730;flex:1}
.modal-b{padding:16px 22px 22px}
.modal-f{display:flex;gap:9px;padding:14px 22px 22px;flex-wrap:wrap;position:sticky;bottom:0;
  background:linear-gradient(180deg,rgba(14,16,22,0),rgba(13,15,20,.96) 34%);backdrop-filter:blur(6px)}
.modal-f .btn{flex:1;min-width:130px}
.fld{margin-bottom:15px}
.fld label{display:block;font-size:12px;font-weight:640;color:var(--muted);margin-bottom:7px}
.fld input,.fld select{width:100%;padding:12px 14px;border-radius:13px;background:var(--card);border:1px solid var(--stroke);outline:none;font-size:15px;transition:.18s}
.fld input:focus{border-color:rgba(255,140,80,.45);box-shadow:0 0 0 4px rgba(255,95,69,.09)}
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:7px}
.emoji-b{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:21px;border:1px solid var(--stroke);background:var(--card);transition:.14s}
.emoji-b:hover{transform:scale(1.08)}
.emoji-b.on{border-color:var(--a1);background:rgba(255,95,69,.16)}

/* ---- Удиви меня: результат ---- */
.sur-res{display:flex;gap:16px;padding:16px;border-radius:var(--r-l);border:1px solid var(--stroke);background:var(--card);margin-bottom:12px;text-align:left;width:100%;transition:.2s}
.sur-res:hover{border-color:var(--stroke-2);transform:translateY(-2px)}
.sur-res .poster{width:82px;height:123px;flex:none;align-self:flex-start}
.sur-res h4{font-size:15.5px;font-weight:690;margin:0 0 5px;line-height:1.25}
.sur-res .m{font-size:12.5px;color:var(--dim);margin-bottom:8px}
.sur-res p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.spin{display:grid;place-items:center;padding:44px 0;gap:16px}
.spin-c{width:56px;height:56px;border-radius:50%;border:3px solid rgba(255,255,255,.1);border-top-color:var(--a1);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- Тосты ---- */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + var(--sab));z-index:200;display:flex;flex-direction:column;gap:9px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:420px}
.toast{
  display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:570;
  background:rgba(20,23,31,.95);border:1px solid var(--stroke-2);backdrop-filter:blur(18px);
  box-shadow:0 16px 40px -14px rgba(0,0,0,.9);animation:toastIn .3s var(--ease);max-width:100%
}
.toast svg{width:17px;height:17px;flex:none;color:var(--mint)}
@keyframes toastIn{from{transform:translateY(18px);opacity:0}}
.toast.out{animation:toastOut .3s forwards}
@keyframes toastOut{to{transform:translateY(12px);opacity:0}}

/* ---- Прочее ---- */
.fade-in{animation:fadeUp .4s var(--ease) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}}
.set-row{display:flex;align-items:center;gap:14px;padding:15px 0;border-top:1px solid var(--stroke)}
.set-row:first-child{border-top:0}
.set-row .t{font-size:14.5px;font-weight:600}
.set-row .d{font-size:12.5px;color:var(--dim);margin-top:3px;line-height:1.45}
.set-row .a{margin-left:auto;flex:none}
.card-p{border:1px solid var(--stroke);background:var(--card);border-radius:var(--r-l);padding:6px 20px;margin-bottom:18px}
.badge-live{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:8px;font-size:11.5px;font-weight:700;background:rgba(62,217,164,.15);color:var(--mint);border:1px solid rgba(62,217,164,.3)}
.badge-off{background:rgba(255,255,255,.06);color:var(--dim);border-color:var(--stroke)}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

#joincode::placeholder{text-transform:none}

/* ---- обновление свайпом ---- */
#ptr{position:fixed;top:calc(6px + var(--sat));left:50%;transform:translate(-50%,0);z-index:60;
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;opacity:0;pointer-events:none;
  background:rgba(14,16,22,.94);border:1px solid var(--stroke-2);backdrop-filter:blur(14px);
  box-shadow:0 10px 26px -10px rgba(0,0,0,.9);transition:opacity .18s}
#ptr .ptr-c{width:17px;height:17px;border-radius:50%;border:2px solid rgba(255,255,255,.16);
  border-top-color:var(--a1);display:block}
#ptr.ready .ptr-c{border-top-color:var(--a2);border-right-color:var(--a1)}
#ptr.spin .ptr-c{animation:spin .8s linear infinite;transform:none!important}

/* ---- семья ---- */
.fam-row{display:flex;align-items:center;gap:10px;margin:18px 0 -4px;padding-bottom:4px}
.fam-l{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);flex:none}
.fam-c{display:flex;align-items:center;gap:9px;padding:7px 12px 7px 7px;border-radius:14px;
  border:1px solid var(--stroke);background:var(--card);transition:.18s;white-space:nowrap}
.fam-c:hover{border-color:var(--stroke-2);transform:translateY(-2px)}
.fam-c .fam-n{font-size:13.5px;font-weight:620}
.fam-c svg{width:15px;height:15px;color:var(--dim)}

/* ---- карточка «это я» ---- */
.me-card{display:flex;align-items:center;gap:16px;padding:20px;border-radius:var(--r-l);
  border:1px solid var(--stroke);background:var(--card);margin-bottom:18px;flex-wrap:wrap}
.me-a{width:64px;height:64px;border-radius:21px;display:grid;place-items:center;font-size:30px;
  border:1px solid var(--stroke-2);flex:none}
.me-i{flex:1;min-width:150px}
.me-n{font-size:21px;font-weight:740;letter-spacing:-.03em}
.me-s{font-size:13px;color:var(--muted);margin-top:4px}
body{overscroll-behavior-y:contain}
.page-back{padding:18px 0 10px}

/* ---- название на обложке прячем, как только загрузилась картинка ---- */
.poster img.in ~ .ph em,
.poster img.in ~ .ph b{opacity:0}
.poster img.in ~ .ph::after{opacity:0}
.poster .ph em,.poster .ph b{transition:opacity .3s}

/* ---- свайп назад ---- */
#swb{position:fixed;left:0;top:50%;z-index:58;width:40px;height:40px;border-radius:0 20px 20px 0;
  display:grid;place-items:center;opacity:0;pointer-events:none;color:var(--muted);
  background:rgba(14,16,22,.92);border:1px solid var(--stroke-2);border-left:0;
  backdrop-filter:blur(12px);transition:opacity .15s,color .15s}
#swb.ready{color:var(--a2)}
#swb svg{width:19px;height:19px}
.shell{transition:transform .18s var(--ease)}

@media (max-width:860px){
  /* в лентах и сетках подпись есть под обложкой — на самой обложке она лишняя */
  .row-s .poster .ph em,.grid .poster .ph em{display:none}
  .row-s .poster .ph b,.grid .poster .ph b{top:50%;transform:translate(-50%,-50%);font-size:5.4em;opacity:.85}
}

/* ============================ Знакомство ============================ */
.onb{max-width:640px;padding-top:clamp(18px,4vh,44px)}
.onb-dots{display:flex;gap:7px;justify-content:center;margin-bottom:clamp(20px,4vh,38px)}
.onb-d{width:26px;height:4px;border-radius:2px;background:rgba(255,255,255,.12);transition:.3s}
.onb-d.done{background:rgba(255,176,60,.55)}
.onb-d.on{width:40px;background:var(--grad)}
.onb-hero{text-align:center;margin-bottom:26px}
.onb-hero .logo-m,.onb-hero .who-a{margin:0 auto 18px}
.onb-t{font-size:clamp(24px,5vw,34px);font-weight:770;letter-spacing:-.035em;margin:0 0 10px}
.onb-s{color:var(--muted);font-size:15px;line-height:1.55;margin:0 0 24px}
.onb-hero .onb-t,.onb-hero .onb-s{margin-bottom:0}
.onb-hero .onb-s{margin-top:10px}
.onb-chips{gap:9px}
.onb-chips .chip{padding:10px 16px;font-size:14px}
.onb-hint{margin-top:18px;font-size:13px;color:var(--dim);text-align:center}
.onb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px 11px;max-height:none}
.onb-f{display:block;text-align:left;transition:.18s var(--ease)}
.onb-f .poster{position:relative;transition:.18s}
.onb-f .onb-ck{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:.18s;
  background:rgba(7,8,12,.62);backdrop-filter:blur(2px)}
.onb-f .onb-ck svg{width:30px;height:30px;color:#fff;stroke-width:2.4;
  background:var(--grad);border-radius:50%;padding:6px;box-shadow:0 6px 18px -4px rgba(0,0,0,.8)}
.onb-f.on .onb-ck{opacity:1}
.onb-f.on .poster{border-color:rgba(255,140,80,.75);box-shadow:0 0 0 2px rgba(255,140,80,.4),var(--sh)}
.onb-f.like .onb-ck svg{color:#170B05;fill:#170B05}
.onb-n{display:block;margin-top:8px;font-size:12.5px;font-weight:580;line-height:1.3;

.onb-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-top:clamp(24px,5vh,40px);padding-top:20px;border-top:1px solid var(--stroke)}
.onb-nav .btn.off{opacity:.45}
.lnk{color:var(--a2);font-weight:600;text-decoration:underline;text-underline-offset:2px}
@media (max-width:860px){

    padding-bottom:10px;z-index:20}

}

/* ---- читаемость поверх кадра на карточке фильма ---- */
.det-info .chip,.det-meta .chip{background:rgba(10,12,17,.72);backdrop-filter:blur(10px);

/* ---- заглушка в плеере трейлера ---- */
.yt-load{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;gap:11px;
  font-size:13.5px;color:var(--muted);background:rgba(6,7,11,.72);backdrop-filter:blur(6px);transition:opacity .35s}

.yt.ready .yt-load,.yt.ready .yt-pre{opacity:0;pointer-events:none}
.yt iframe{position:relative;z-index:4;background:transparent}

/* ---- анимация баннера при свайпе ---- */
.hero{transition:transform .22s var(--ease),opacity .22s}
.hero.out-l{transform:translateX(-26px);opacity:.25}
.hero.out-r{transform:translateX(26px);opacity:.25}
.hero.in-l{transform:translateX(-26px);opacity:.25}
.hero.in-r{transform:translateX(26px);opacity:.25}

@media (max-width:860px){

.f-head{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:6px 0 4px}

/* ---- импорт списка ---- */
.imp-ta{width:100%;min-height:190px;padding:14px 16px;border-radius:var(--r-m);resize:vertical;
  background:var(--card);border:1px solid var(--stroke);outline:none;font-size:14.5px;line-height:1.6;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.imp-ta:focus{border-color:rgba(255,140,80,.45);box-shadow:0 0 0 4px rgba(255,95,69,.09)}
.imp-bar{width:200px;height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.imp-bar span{display:block;height:100%;background:var(--grad);transition:width .25s}
.imp-sum{display:flex;gap:14px;flex-wrap:wrap;padding:11px 14px;border-radius:var(--r-m);margin-bottom:14px;
  background:var(--card);border:1px solid var(--stroke);font-size:13px;color:var(--muted)}
.imp-sum b{color:var(--txt);font-size:15px;font-weight:730;margin-right:4px}
.imp-sum .miss{color:#F87171}
.imp-sum .miss b{color:#F87171}
.imp-list{max-height:46vh;overflow-y:auto;display:flex;flex-direction:column;gap:9px;margin:0 -4px;padding:0 4px}
.imp-row{display:flex;align-items:center;gap:12px;padding:9px 11px;border-radius:14px;
  border:1px solid var(--stroke);background:var(--card)}
.imp-row.miss{border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.07)}
.imp-p{position:relative;width:38px;height:57px;border-radius:8px;overflow:hidden;flex:none;background:var(--bg-3);
  display:grid;place-items:center}
.imp-p img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:.3s}
.imp-p img.in{opacity:1}
.imp-ph{font-size:16px;font-weight:750;color:rgba(255,255,255,.3)}
.imp-i{flex:1;min-width:0}
.imp-t{font-size:13.5px;font-weight:640;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imp-y{color:var(--dim);font-weight:500}
.imp-q{font-size:11.5px;color:var(--dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imp-seg{margin-left:0;flex:none}
.imp-seg .seg-b{padding:5px 9px;font-size:11.5px}
.lib-acts{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0 -4px}

/* ---- быстрая оценка ---- */
.modal.qr{position:relative}
.qr .qr-pos{position:absolute;top:14px;left:22px;font-size:11.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--dim)}
.qr-head{display:flex;gap:14px;align-items:flex-start;padding:26px 22px 6px}
.qr-p{width:74px;flex:none}
.qr-p .poster{border-radius:12px}
.qr-i{flex:1;min-width:0}
.qr-t{font-size:18px;font-weight:730;letter-spacing:-.02em;line-height:1.2}
.qr-m{font-size:12.5px;color:var(--dim);margin-top:4px}
.qr-lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.qr-stars{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.qr-s{height:44px;border-radius:11px;display:grid;place-items:center;font-size:14px;font-weight:700;
  color:var(--muted);border:1px solid var(--stroke);background:var(--card);transition:.14s;font-variant-numeric:tabular-nums}
.qr-s:hover{border-color:var(--stroke-2);color:var(--txt);transform:translateY(-2px)}

.det-acts .btn{background:rgba(8,10,15,.88);backdrop-filter:blur(14px);border-color:rgba(255,255,255,.24)}
.det-info .det-meta{color:#DFE4EE;text-shadow:0 1px 12px rgba(0,0,0,.85)}
.det-t{text-shadow:0 2px 20px rgba(0,0,0,.9)}

/* ---- тематические подборки ---- */
.coll-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:11px}
.coll{display:flex;align-items:center;gap:11px;padding:14px 15px;border-radius:16px;text-align:left;

{id:'s02',t:'День разоблачения',o:'Disclosure Day',y:2026,k:'movie',st:'soon',rd:'12 ноября 2026',g:['Фантастика','Драма','Триллер'],kp:8.2,im:8.0,dur:148,co:'США',dir:'Стивен Спилберг',cast:['Эмили Блант','Джош О\'Коннор','Колин Ферт','Ева Грин','Уайатт Расселл'],age:16,d:'Правительства одновременно рассекречивают то, что скрывали полвека. Спилберг возвращается к теме первого контакта — но снимает не про корабли, а про людей в тот день, когда всё оказалось правдой.'},

{id:'s04',t:'Кристоферы',o:'The Christophers',y:2026,k:'movie',st:'soon',rd:'25 сентября 2026',g:['Драма','Комедия','Криминал'],kp:7.5,im:7.3,dur:106,co:'США',dir:'Стивен Содерберг',cast:['Микаэла Коэл','Джессика Ганнинг','Джеймс Корден','Иэн Маккеллен'],age:16,d:'Молодая художница втирается в доверие к великому старику, чтобы дописать за него незаконченную серию портретов. Афера идёт по плану ровно до того момента, когда становится личной.'},
{id:'s05',t:'Мелодия их мечты',o:'Song Sung Blue',y:2026,k:'movie',st:'soon',rd:'17 сентября 2026',g:['Драма','Мелодрама','Мюзикл'],kp:7.7,im:7.4,dur:118,co:'США',dir:'Крэйг Брюэр',cast:['Хью Джекман','Кейт Хадсон','Майкл Империоли','Джессика Хенвик'],age:16,d:'Двое неудачливых музыкантов из Милуоки собирают трибьют-дуэт Нила Даймонда и внезапно становятся местными звёздами. Основано на реальной истории — со всем, что за ней последовало.'},
{id:'s06',t:'Эта штука работает?',o:'Is This Thing On?',y:2026,k:'movie',st:'soon',rd:'8 октября 2026',g:['Драма','Комедия'],kp:7.3,im:7.1,dur:101,co:'США',dir:'Брэдли Купер',cast:['Уилл Арнетт','Лора Дерн','Брэдли Купер','Эндра Дэй'],age:18,d:'Мужчина в разводе случайно выходит к открытому микрофону в подвальном клубе Нью-Йорка — и обнаруживает, что говорить со сцены проще, чем дома.'},
{id:'s07',t:'Коммерсант',o:'Kommersant',y:2026,k:'movie',st:'soon',rd:'24 сентября 2026',g:['Драма','Криминал'],kp:7.6,im:7.0,dur:129,co:'Россия',dir:'Фёдор Кравчук, Никита Кравчук',cast:['Александр Петров','Михаил Тройник','Хаски','Юра Борисов'],age:18,d:'Бизнесмен заходит в «Матросскую тишину» на пару недель и остаётся там надолго. Экранизация автобиографического романа о том, как устроена изнанка большого дела.'},
{id:'s08',t:'Лунтик. Обратная сторона луны',o:'Luntik. Dark Side of the Moon',y:2026,k:'movie',st:'soon',rd:'27 августа 2026',g:['Анимация','Семейный','Приключения'],kp:6.9,im:6.2,dur:76,co:'Россия',dir:'Дарина Шмидт',cast:['Дмитрий Полонский','Ольга Шорохова','Юрий Маляров'],age:0,d:'Лунтик впервые отправляется туда, откуда прилетел. На обратной стороне Луны его ждут те, кто помнит его гораздо лучше, чем он сам.'},

{id:'s10',t:'Чучело',o:'Scarecrow',y:2026,k:'movie',st:'soon',rd:'27 августа 2026',g:['Драма','Мюзикл'],kp:7.4,im:6.8,dur:121,co:'Россия',dir:'Анна Меликян',cast:['Аглая Тарасова','Евгений Ткачук','Виктория Исакова'],age:16,d:'Музыкальное переосмысление хрестоматийной истории о девочке, которая приняла на себя чужую вину. Школьный двор здесь снят как сцена, а травля — как хоровой номер.'},

{id:'p01',t:'Мстители: Судный день',o:'Avengers: Doomsday',y:2027,k:'movie',st:'prod',rd:'декабрь 2027',g:['Боевик','Фантастика','Приключения'],kp:0,im:0,dur:0,co:'США',dir:'Энтони Руссо, Джо Руссо',cast:['Роберт Дауни мл.','Крис Хемсворт','Ванесса Кирби','Педро Паскаль','Себастиан Стэн'],age:12,d:'Мультивселенная сходится в одной точке, а на другой стороне — Доктор Дум. Съёмки завершены, студия держит сюжет в секрете жёстче обычного.'},

{id:'p03',t:'Онегин. Другая история',o:'Onegin. Another Story',y:2027,k:'movie',st:'prod',rd:'2027',g:['Драма','Мелодрама','История'],kp:0,im:0,dur:0,co:'Россия',dir:'Сарик Андреасян',cast:['Виктор Добронравов','Лиза Моряк','Денис Прытков'],age:16,d:'Проект в активной подготовке: съёмочная группа обещает взгляд на классический сюжет со стороны Татьяны. Материалов пока минимум.'},
{id:'p04',t:'Голодные игры: Восход Жнеца',o:'The Hunger Games: Sunrise on the Reaping',y:2026,k:'movie',st:'soon',rd:'20 ноября 2026',g:['Фантастика','Боевик','Драма'],kp:7.5,im:7.3,dur:0,co:'США',dir:'Фрэнсис Лоуренс',cast:['Джозеф Зада','Уитни Пик','Ральф Файнс','Кирнан Шипка','Элль Фаннинг'],age:16,d:'Пятидесятые Голодные игры, где на арену отправляют вдвое больше трибутов — и юного Хеймитча Эбернети. История, о которой он потом молчал всю жизнь.'},

{id:'r02',t:'Роднина',o:'Rodnina',y:2025,k:'movie',st:'digital',g:['Биография','Драма','Спорт'],kp:8.3,im:7.4,dur:132,co:'Россия',dir:'Дмитрий Иосифов',cast:['Дарья Балабанова','Александр Яценко','Мария Аронова','Кузьма Сапрыкин'],age:12,d:'Путь Ирины Родниной от девочки, которую врачи списали по здоровью, до трёхкратной олимпийской чемпионки — и цена, которую за это платили все вокруг.'},

{id:'r07',t:'Туда',o:'Tuda',y:2025,k:'movie',st:'digital',g:['Драма','Комедия','Приключения'],kp:7.4,im:6.9,dur:107,co:'Россия',dir:'Александр Ханин',cast:['Юра Борисов','Ирина Горбачёва','Сергей Двойников'],age:16,d:'Двое случайных попутчиков едут на такси из Москвы в Уфу. Полторы тысячи километров, за которые оба успевают разругаться, помириться и перестать врать.'},
{id:'r08',t:'Беги',o:'Run',y:2025,k:'movie',st:'digital',g:['Криминал','Комедия','Триллер'],kp:7.4,im:6.7,dur:99,co:'Россия',dir:'Иван Соснин',cast:['Максим Стоянов','Евгений Ткачук','Полина Ауг'],age:18,d:'Мелкий вор залезает не в ту квартиру и становится единственным свидетелем убийства. Дальше — сутки бега по городу, где помочь ему некому.'},
{id:'r09',t:'Знакомство родителей',o:'Meet the Parents',y:2025,k:'movie',st:'digital',g:['Комедия','Мелодрама'],kp:7.4,im:6.5,dur:94,co:'Россия',dir:'Роман Каримов',cast:['Иван Янковский','Аглая Тарасова','Сергей Бурунов','Ирина Пегова'],age:16,d:'Молодой предприниматель разыскивает биологических родителей, чтобы получить их благословение на свадьбу. Находит гораздо больше, чем планировал.'},
{id:'r10',t:'Лихие',o:'The Wild Ones',y:2024,k:'series',st:'digital',g:['Криминал','Драма'],kp:8.0,im:7.8,seasons:2,eps:8,dur:50,co:'Россия',dir:'Юрий Быков',cast:['Артём Быстров','Евгений Ткачук','Егор Кенжаметов','Елена Николаева'],age:18,d:'Хабаровск девяностых. Отец берёт сына-подростка на дело, чтобы тот научился выживать. Быков снимает бандитскую сагу как семейную трагедию.'},
{id:'r11',t:'Слово пацана. Кровь на асфальте',o:'Boy\'s Word',y:2023,k:'series',st:'digital',g:['Криминал','Драма'],kp:8.0,im:8.2,seasons:1,eps:8,dur:52,co:'Россия',dir:'Жора Крыжовников',cast:['Леон Кемстач','Рузиль Минекаев','Иван Янковский','Анна Пересильд'],age:18,d:'Казань 1989-го, поделённая уличными группировками. Тихий школьник попадает в улицу и обнаруживает, что выйти оттуда можно только одним способом.'},
{id:'r12',t:'Эпидемия',o:'To the Lake',y:2019,k:'series',st:'digital',g:['Триллер','Драма','Фантастика'],kp:7.7,im:7.4,seasons:2,eps:8,dur:48,co:'Россия',dir:'Павел Костомаров',cast:['Кирилл Кяро','Виктория Исакова','Александр Робак','Марьяна Спивак'],age:18,d:'Из Москвы, охваченной неизвестным вирусом, несколько семей пробиваются на север к озеру. Постапокалипсис, в котором страшнее всего оказываются попутчики.'},

{id:'d06',t:'Хищник: Планета смерти',o:'Predator: Badlands',y:2025,k:'movie',st:'digital',g:['Фантастика','Боевик','Приключения'],kp:7.3,im:7.4,dur:107,co:'США',dir:'Дэн Трахтенберг',cast:['Эль Фаннинг','Димитриус Шустер-Колоаматанги','Рома Уотсон'],age:16,d:'Изгнанный молодой яутжа высаживается на планету, где всё живое опаснее его самого, и находит союзника там, где не должен был. Первый «Хищник», где хищник — главный герой.'},

{id:'t15',t:'ГКС. Сент-Луис',o:'DTF St. Louis',y:2026,k:'series',st:'digital',g:['Детектив','Драма','Комедия'],kp:7.6,im:7.5,seasons:1,eps:8,dur:53,co:'США',dir:'Джейсон Бейтман',cast:['Джейсон Бейтман','Дэвид Харбор','Линда Карделлини','Ричард Дженкинс'],age:18,d:'Двое друзей за сорок регистрируются в приложении для знакомств. Через месяц одного находят мёртвым. Экранизация журналистского расследования.'},
{id:'t16',t:'Рустер',o:'Rooster',y:2026,k:'series',st:'digital',g:['Комедия','Драма'],kp:7.4,im:7.3,seasons:1,eps:10,dur:30,co:'США',dir:'Билл Лоуренс',cast:['Стив Карелл','Даниэль Дэдвайлер','Фил Данстер','Чарли Клайв'],age:16,d:'Писатель в кризисе устраивается преподавать в тот самый колледж, где учится его дочь. От создателя «Теда Лассо».'},
{id:'t17',t:'Спартак: Дом Ашура',o:'Spartacus: House of Ashur',y:2026,k:'series',st:'digital',g:['История','Боевик','Драма'],kp:7.2,im:7.1,seasons:1,eps:10,dur:52,co:'США',dir:'Стивен ДеНайт',cast:['Ник Э. Тарабай','Грэм МакТавиш','Тенника Смит','Джордан Родригес'],age:18,d:'Предатель Ашур получает собственную гладиаторскую школу и пытается стать римлянином среди римлян. Возвращение франшизы со всей её кровью и стилем.'},
{id:'t18',t:'У меня очень плохое предчувствие',o:'Something Very Bad Is Going to Happen',y:2026,k:'series',st:'digital',g:['Ужасы','Триллер','Драма'],kp:7.1,im:7.0,seasons:1,eps:8,dur:45,co:'США',dir:'Крис Пекхэм',cast:['Камила Морроне','Адам ДиМарко','Гас Бирни','Карла Кроум'],age:18,d:'За неделю до свадьбы невеста приезжает в лесной дом семьи жениха с ощущением, что случится что-то непоправимое. Ощущение её не обманывает.'},
{id:'t19',t:'Повелитель мух',o:'Lord of the Flies',y:2026,k:'series',st:'digital',g:['Драма','Триллер'],kp:7.7,im:7.6,seasons:1,eps:4,dur:58,co:'Великобритания',dir:'Марк Мандэн',cast:['Эйдан Мониган','Кит Родс','Табиан Кит-Гулд'],age:16,d:'Новая экранизация Голдинга от BBC. Мальчики на острове проходят весь путь от выборов до охоты за четыре серии.'},

{id:'t20',t:'Разделение',o:'Severance',y:2022,k:'series',st:'digital',g:['Фантастика','Триллер','Драма'],kp:8.1,im:8.7,seasons:2,eps:10,dur:50,co:'США',dir:'Бен Стиллер',cast:['Адам Скотт','Бритт Лоуэр','Патрисия Аркетт','Джон Туртурро','Кристофер Уокен'],age:18,d:'Сотрудники Lumon согласились разделить сознание: тот, кто работает, не помнит жизни снаружи. Один из них начинает подозревать, что снаружи всё не так, как ему рассказали.'},
{id:'t21',t:'Медведь',o:'The Bear',y:2022,k:'series',st:'digital',g:['Драма','Комедия'],kp:7.9,im:8.6,seasons:4,eps:10,dur:32,co:'США',dir:'Кристофер Сторер',cast:['Джереми Аллен Уайт','Айо Эдебири','Эбон Мосс-Бакрак','Лайонел Бойс'],age:18,d:'Шеф-повар из мишленовского ресторана возвращается в Чикаго, чтобы вытащить забегаловку покойного брата. Сериал, который снял тревожность как жанр.'},
{id:'t22',t:'Пингвин',o:'The Penguin',y:2024,k:'series',st:'digital',g:['Криминал','Драма','Триллер'],kp:8.1,im:8.5,seasons:1,eps:8,dur:60,co:'США',dir:'Лорен ЛеФранк',cast:['Колин Фаррелл','Кристин Милиоти','Ронда Ро','Клэнси Браун'],age:18,d:'Готэм после потопа делят заново. Освальд Кобб поднимается со дна, обходя всех, кто считал его шутом. Милиоти в роли Софии Фальконе — событие года.'},
{id:'t23',t:'Сёгун',o:'Shogun',y:2024,k:'series',st:'digital',g:['История','Драма','Боевик'],kp:8.2,im:8.6,seasons:1,eps:10,dur:58,co:'США, Япония',dir:'Джастин Маркс',cast:['Хироюки Санада','Косима Анна','Космо Джарвис','Таданобу Асано'],age:18,d:'Английский штурман выбрасывается на японский берег в 1600 году и становится фигурой в чужой партии. Восемнадцать «Эмми» и новый стандарт исторического сериала.'},
{id:'t24',t:'Одни из нас',o:'The Last of Us',y:2023,k:'series',st:'digital',g:['Драма','Триллер','Фантастика'],kp:8.1,im:8.6,seasons:2,eps:9,dur:55,co:'США',dir:'Крейг Мазин',cast:['Педро Паскаль','Белла Рамзи','Кэтрин О\'Хара','Гэбриэл Луна'],age:18,d:'Через двадцать лет после грибковой пандемии контрабандист везёт девочку через мёртвую Америку. Лучшая экранизация игры из всех, что были.'},
{id:'t25',t:'Чернобыль',o:'Chernobyl',y:2019,k:'series',st:'digital',g:['Драма','История','Триллер'],kp:9.0,im:9.3,seasons:1,eps:5,dur:65,co:'США, Великобритания',dir:'Йохан Ренк',cast:['Джаред Харрис','Стеллан Скарсгард','Эмили Уотсон','Пол Риттер'],age:18,d:'Пять серий о том, как ложь становится физической величиной. Мазин снял катастрофу как процедурал, и от этого страшнее вдвойне.'},
{id:'t26',t:'Во все тяжкие',o:'Breaking Bad',y:2008,k:'series',st:'digital',g:['Криминал','Драма','Триллер'],kp:8.9,im:9.5,seasons:5,eps:13,dur:47,co:'США',dir:'Винс Гиллиган',cast:['Брайан Крэнстон','Аарон Пол','Анна Ганн','Дин Норрис','Джанкарло Эспозито'],age:18,d:'Школьный химик с раком лёгких начинает варить метамфетамин, чтобы оставить семье деньги. Пять сезонов безупречной эволюции героя в чудовище.'},
{id:'t27',t:'Игра престолов',o:'Game of Thrones',y:2011,k:'series',st:'digital',g:['Фэнтези','Драма','Приключения'],kp:9.0,im:9.2,seasons:8,eps:10,dur:57,co:'США',dir:'Дэвид Бениофф, Д. Б. Уайсс',cast:['Эмилия Кларк','Питер Динклэйдж','Кит Харингтон','Лена Хиди','Мэйси Уильямс'],age:18,d:'Семь королевств делят Железный трон, пока с севера идёт зима. Сериал, который на десять лет переопределил, каким бывает телевидение.'},
{id:'t28',t:'Клан Сопрано',o:'The Sopranos',y:1999,k:'series',st:'digital',g:['Криминал','Драма'],kp:8.7,im:9.2,seasons:6,eps:13,dur:55,co:'США',dir:'Дэвид Чейз',cast:['Джеймс Гандольфини','Эди Фалко','Лоррейн Бракко','Майкл Империоли'],age:18,d:'Босс нью-джерсийской мафии ходит к психотерапевту с паническими атаками. Сериал, с которого начался золотой век драмы.'},
{id:'t29',t:'Тьма',o:'Dark',y:2017,k:'series',st:'digital',g:['Фантастика','Триллер','Детектив'],kp:8.4,im:8.7,seasons:3,eps:8,dur:55,co:'Германия',dir:'Баран бо Одар',cast:['Луис Хофманн','Лиза Вкачёва','Оливер Мазуччи','Мойзес Блайбтрой'],age:18,d:'В немецком городке пропадают дети, а под АЭС находится проход, который связывает 1953, 1986 и 2019 годы. Самая аккуратно собранная головоломка о времени.'},
{id:'t30',t:'Аркейн',o:'Arcane',y:2021,k:'series',st:'digital',g:['Анимация','Фэнтези','Драма'],kp:8.6,im:9.0,seasons:2,eps:9,dur:42,co:'Франция, США',dir:'Паскаль Шарруф',cast:['Хейли Стайнфелд','Элла Пёрнелл','Кевин Алехандро','Кэти Люн'],age:18,d:'Две сестры оказываются по разные стороны войны между сияющим Пилтовером и подземным Зауном. Анимация, которая доказала, что игровая франшиза бывает искусством.'},
{id:'t31',t:'Дом Дракона',o:'House of the Dragon',y:2022,k:'series',st:'digital',g:['Фэнтези','Драма','Боевик'],kp:7.8,im:8.3,seasons:2,eps:10,dur:62,co:'США',dir:'Райан Кондал',cast:['Мэтт Смит','Эмма Д\'Арси','Оливия Кук','Рис Иванс','Ив Бест'],age:18,d:'За двести лет до основной саги Таргариены начинают убивать друг друга за трон. Танец драконов, снятый как семейный распад.'},
{id:'t32',t:'Задача трёх тел',o:'3 Body Problem',y:2024,k:'series',st:'digital',g:['Фантастика','Драма','Триллер'],kp:7.4,im:7.5,seasons:1,eps:8,dur:55,co:'США',dir:'Дэвид Бениофф, Д. Б. Уайсс',cast:['Джесс Хонг','Джован Адепо','Эйса Гонсалес','Бенедикт Вонг','Лиам Каннингэм'],age:18,d:'Учёные по всему миру начинают гибнуть, а физика перестаёт работать. Причина ведёт к решению, принятому в Китае в шестидесятых.'},

{id:'k01',t:'Побег из Шоушенка',o:'The Shawshank Redemption',y:1994,k:'movie',st:'digital',g:['Драма','Криминал'],kp:9.1,im:9.3,dur:142,co:'США',dir:'Фрэнк Дарабонт',cast:['Тим Роббинс','Морган Фриман','Боб Гантон','Уильям Сэдлер'],age:16,d:'Банкира сажают пожизненно за убийство, которого он не совершал. Девятнадцать лет он ведёт бухгалтерию тюрьмы — и роет тоннель ложкой.'},
{id:'k02',t:'Зелёная миля',o:'The Green Mile',y:1999,k:'movie',st:'digital',g:['Драма','Фэнтези','Криминал'],kp:9.1,im:8.6,dur:189,co:'США',dir:'Фрэнк Дарабонт',cast:['Том Хэнкс','Майкл Кларк Дункан','Дэвид Морс','Бонни Хант'],age:16,d:'В блок смертников попадает огромный человек, осуждённый за убийство двух девочек. Охранники быстро понимают, что он не тот, за кого его приняли.'},
{id:'k03',t:'Начало',o:'Inception',y:2010,k:'movie',st:'digital',g:['Фантастика','Боевик','Триллер'],kp:8.7,im:8.8,dur:148,co:'США, Великобритания',dir:'Кристофер Нолан',cast:['Леонардо ДиКаприо','Джозеф Гордон-Левитт','Эллен Пейдж','Том Харди','Марион Котийяр'],age:12,d:'Вор, крадущий идеи из снов, получает обратное задание — внедрить мысль. Для этого придётся спуститься на три уровня сна и вернуться.'},
{id:'k04',t:'Интерстеллар',o:'Interstellar',y:2014,k:'movie',st:'digital',g:['Фантастика','Драма','Приключения'],kp:8.6,im:8.7,dur:169,co:'США, Великобритания',dir:'Кристофер Нолан',cast:['Мэттью Макконахи','Энн Хэтэуэй','Джессика Честейн','Майкл Кейн','Мэтт Дэймон'],age:16,d:'Земля умирает, и бывший пилот уходит через червоточину искать новый дом, зная, что каждый час там стоит семь лет здесь.'},
{id:'k05',t:'Бойцовский клуб',o:'Fight Club',y:1999,k:'movie',st:'digital',g:['Драма','Триллер'],kp:8.6,im:8.8,dur:139,co:'США, Германия',dir:'Дэвид Финчер',cast:['Брэд Питт','Эдвард Нортон','Хелена Бонем Картер','Мит Лоуф'],age:18,d:'Офисный работник с бессонницей встречает продавца мыла и вместе они основывают клуб, где мужчины бьют друг друга по субботам. Дальше клуб разрастается.'},
{id:'k06',t:'Тёмный рыцарь',o:'The Dark Knight',y:2008,k:'movie',st:'digital',g:['Боевик','Криминал','Драма'],kp:8.5,im:9.0,dur:152,co:'США, Великобритания',dir:'Кристофер Нолан',cast:['Кристиан Бэйл','Хит Леджер','Аарон Экхарт','Гэри Олдман','Морган Фриман'],age:16,d:'В Готэме появляется преступник без имени, целей и цены. Бэтмен впервые сталкивается с тем, кого нельзя ни купить, ни напугать.'},
{id:'k07',t:'Криминальное чтиво',o:'Pulp Fiction',y:1994,k:'movie',st:'digital',g:['Криминал','Драма','Комедия'],kp:8.6,im:8.9,dur:154,co:'США',dir:'Квентин Тарантино',cast:['Джон Траволта','Сэмюэл Л. Джексон','Ума Турман','Брюс Уиллис','Тим Рот'],age:18,d:'Два киллера, боксёр и жена босса — четыре истории Лос-Анджелеса, рассказанные не по порядку и навсегда изменившие кинематограф девяностых.'},
{id:'k08',t:'Властелин колец: Возвращение короля',o:'The Lord of the Rings: The Return of the King',y:2003,k:'movie',st:'digital',g:['Фэнтези','Приключения','Драма'],kp:8.6,im:9.0,dur:201,co:'Новая Зеландия, США',dir:'Питер Джексон',cast:['Элайджа Вуд','Вигго Мортенсен','Иэн Маккеллен','Шон Остин','Энди Серкис'],age:12,d:'Финал трилогии: Фродо доходит до Роковой горы, а Арагорн принимает корону. Одиннадцать «Оскаров» из одиннадцати номинаций.'},
{id:'k09',t:'Паразиты',o:'Parasite',y:2019,k:'movie',st:'digital',g:['Драма','Триллер','Комедия'],kp:8.0,im:8.5,dur:132,co:'Южная Корея',dir:'Пон Джун-хо',cast:['Сон Кан Хо','Ли Сон Гюн','Чо Ё Джон','Чхве У Сик','Пак Со Дам'],age:18,d:'Бедная семья по одному устраивается работать в дом богатой. План идеален ровно до того момента, когда они спускаются в подвал.'},
{id:'k10',t:'Джокер',o:'Joker',y:2019,k:'movie',st:'digital',g:['Драма','Триллер','Криминал'],kp:7.9,im:8.3,dur:122,co:'США, Канада',dir:'Тодд Филлипс',cast:['Хоакин Феникс','Роберт Де Ниро','Зази Битц','Фрэнсис Конрой'],age:18,d:'Неудачливый комик с психическим расстройством постепенно перестаёт различать, где заканчивается его номер и начинается город.'},
{id:'k11',t:'Унесённые призраками',o:'Spirited Away',y:2001,k:'movie',st:'digital',g:['Анимация','Фэнтези','Приключения'],kp:8.4,im:8.6,dur:125,co:'Япония',dir:'Хаяо Миядзаки',cast:['Руми Хиираги','Мию Ирино','Мари Нацуки','Такаси Найто'],age:6,d:'Девочка попадает в мир духов, где её родителей превратили в свиней, а имя у неё отняли. Чтобы вернуться, придётся вспомнить, кто она.'},
{id:'k12',t:'Твоё имя',o:'Your Name',y:2016,k:'movie',st:'digital',g:['Анимация','Мелодрама','Фэнтези'],kp:8.4,im:8.4,dur:106,co:'Япония',dir:'Макото Синкай',cast:['Рюноскэ Камики','Мон Камисираиси','Масами Нагасава'],age:12,d:'Школьник из Токио и школьница из деревни просыпаются в телах друг друга. Когда обмены прекращаются, он едет её искать — и выясняет, почему.'},
{id:'k13',t:'Оппенгеймер',o:'Oppenheimer',y:2023,k:'movie',st:'digital',g:['Биография','Драма','История'],kp:8.2,im:8.3,dur:180,co:'США, Великобритания',dir:'Кристофер Нолан',cast:['Киллиан Мёрфи','Эмили Блант','Роберт Дауни мл.','Мэтт Дэймон','Флоренс Пью'],age:18,d:'Человек, собравший бомбу, и слушания, на которых его за это уничтожили. Три часа на плёнке IMAX без единого кадра компьютерной графики.'},
{id:'k14',t:'Прибытие',o:'Arrival',y:2016,k:'movie',st:'digital',g:['Фантастика','Драма','Детектив'],kp:7.6,im:7.9,dur:116,co:'США',dir:'Дени Вильнёв',cast:['Эми Адамс','Джереми Реннер','Форест Уитакер','Майкл Стулбарг'],age:16,d:'Двенадцать кораблей зависают над Землёй, и лингвистку просят выяснить, зачем они прилетели. Ответ меняет её понимание времени.'},

/* ================================================================

  if(!remote||!remote.profiles) return local;
  const out={...local};
  /* Метки удаления. Без них профиль, стёртый на телефоне, возвращался бы
     с сервера при первом же слиянии — списки-то объединяются. */
  const gone={};
  [remote.gone||{},local.gone||{}].forEach(src=>Object.entries(src).forEach(([id,t])=>{
    if(!gone[id]||gone[id]<t) gone[id]=t;
  }));
  const cutoff=Date.now()-90*24*3600*1000;
  Object.keys(gone).forEach(id=>{ if(gone[id]<cutoff) delete gone[id] });
  out.gone=gone;
  const byIdL={}; (local.profiles||[]).forEach(p=>byIdL[p.id]=p);
  const byIdR={}; (remote.profiles||[]).forEach(p=>byIdR[p.id]=p);
  const ids=Array.from(new Set(Object.keys(byIdL).concat(Object.keys(byIdR))))
    .filter(id=>{
      const t=gone[id]; if(!t) return true;
      const p=byIdL[id]||byIdR[id];
      return (p&&p.up||0)>t;      // профиль вернётся, только если его правили ПОСЛЕ удаления
    });
  out.profiles=ids.map(id=>{
    const a=byIdL[id], b=byIdR[id];
    if(!a) return b; if(!b) return a;
    const newer=(a.up||0)>=(b.up||0)?a:b, older=newer===a?b:a;
    const uni=(x,y)=>Array.from(new Set([].concat(x||[],y||[])));
    return {...older,...newer,
      lists:{later:uni(a.lists&&a.lists.later,b.lists&&b.lists.later),
             seen:uni(a.lists&&a.lists.seen,b.lists&&b.lists.seen)},
      ratings:{...(older.ratings||{}),...(newer.ratings||{})},
      items:{...(older.items||{}),...(newer.items||{})},
      read:uni(a.read,b.read),
      hide:uni(a.hide,b.hide), hideFr:uni(a.hideFr,b.hideFr),
      nov:newer.nov!==undefined?newer.nov:older.nov,
      fav:(newer.fav||[]).slice()};
  }).filter(Boolean);
  if(!out.profiles.some(p=>p.id===out.active)) out.active=out.profiles[0].id;
  if(DEV.active&&!out.profiles.some(p=>p.id===DEV.active)){ DEV.active=''; devSave() }
  return out;
}

/* модели любят обрамлять JSON пояснениями и ```-заборчиками — вычищаем */
function parseLoose(raw){
  if(!raw) return null;
  let t=String(raw).trim().replace(/^```[a-z]*\s*/i,'').replace(/```\s*$/,'');
  const i=t.indexOf('{'), j=t.lastIndexOf('}');
  if(i>=0&&j>i) t=t.slice(i,j+1);
  try{ return JSON.parse(t) }catch(e){}
  /* ответ обрезали на полуслове — закрываем скобки и пробуем ещё раз */
  let fix=t.replace(/,\s*$/,'').replace(/"[^"]*$/,'""');
  const open=(fix.match(/\[/g)||[]).length-(fix.match(/\]/g)||[]).length;
  const brace=(fix.match(/\{/g)||[]).length-(fix.match(/\}/g)||[]).length;
  fix+=']'.repeat(Math.max(0,open))+'}'.repeat(Math.max(0,brace));
  try{ return JSON.parse(fix) }catch(e){}
  return null;
}
/* Две попытки: строгий json-режим, потом обычный текст с просьбой прислать только JSON.
   Часть бесплатных моделей не умеет response_format и на первой попытке отвечает мусором. */
async function aiJson(messages,opts){
  opts=opts||{};
  const raw=await aiAsk(messages,Object.assign({},opts,{json:true}));
  const d=parseLoose(raw);
  if(d) return d;
  if(raw) AI.err='ответ не разобрался';
  const retry=messages.concat([{role:'user',
    content:'Пришли ТОЛЬКО валидный JSON по описанному формату. Без пояснений, без markdown, без ```.'}]);
  const raw2=await aiAsk(retry,Object.assign({},opts,{json:false,fresh:true}));
  return parseLoose(raw2);
}

    y, g:(r.genre_ids||[]).map(g=>GID[g]).filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).slice(0,3),
    tm:Math.round((r.vote_average||0)*10)/10, votes:r.vote_count||0,
    kp:0, im:0, d:r.overview||'', st:'digital', rd:r.release_date||r.first_air_date||'',
    _p:r.poster_path||null, _b:r.backdrop_path||null, live:true
  };
  const t=today();
  if(it.rd&&it.rd>t) it.st='soon';
  const k=KPR[it.id]||kpFor(it);
  if(k){ if(k.kp)it.kp=k.kp; if(k.im)it.im=k.im }
  return it;
}
function mapList(d,mt,st){
  return (d&&d.results||[]).map(r=>mapItem(r,mt)).filter(Boolean)
    .filter(x=>x.t&&(x._p||x._b))
    .map(x=>{if(st)x.st=st;return x});
}
/* офлайн-элемент → тот же вид */
function offItem(f){return Object.assign({},f,{mt:f.k==='series'?'tv':'movie',tm:0,votes:0,live:false})}

const REG={}; // реестр всех виденных объектов: id → item
/* реестр хранит один объект на фильм: обогатили карточку — обновились и все списки */
function reg(list){
  return (list||[]).map(x=>{
    if(!x||!x.id) return x;
    const cur=REG[x.id];
    if(!cur){ REG[x.id]=x; return x }
    Object.keys(x).forEach(k=>{
      const v=x[k];
      if((v===0||v==='')&&['kp','im','age','dur','seasons'].includes(k)&&cur[k]) return;  // не затираем уточнённое
      if(v==null&&cur[k]!=null) return;
      if(Array.isArray(v)&&!v.length&&Array.isArray(cur[k])&&cur[k].length) return;
      cur[k]=v;
    });
    return cur;
  });
}
function byId(id){
  if(REG[id]) return REG[id];
  if(OFFBY[id]) return offItem(OFFBY[id]);
  const p=P(); if(p.items&&p.items[id]) return p.items[id];
  return null;
}
/* компактный снимок для библиотеки — чтобы списки работали без сети */
function snap(it){
  return {id:it.id,tmdb:it.tmdb,mt:it.mt,k:it.k,t:it.t,o:it.o,y:it.y,g:it.g,
    tm:it.tm,kp:it.kp,im:it.im,st:it.st,rd:it.rd,d:(it.d||'').slice(0,300),_p:it._p,_b:it._b};
}
function remember(it){
  const p=P(); if(!p.id) return;
  p.items=p.items||{}; p.items[it.id]=snap(it);
}

/* ---------------------------------------------------------------- статус релиза */
function statusFromDetail(det,mt){
  if(['In Production','Planned','Post Production'].includes(det.status)) return 'prod';
  if(mt==='tv') return 'digital';
  const rows=(det.release_dates&&det.release_dates.results)||[];
  const g=rows.find(x=>x.iso_3166_1==='RU')||rows.find(x=>x.iso_3166_1==='US')||rows[0];
  const t=today(); let dig=false,cinDate='',future=null;
  ((g&&g.release_dates)||[]).forEach(r=>{
    const d=String(r.release_date||'').slice(0,10);
    if(!d) return;
    if(d<=t){ if(r.type>=4) dig=true; if((r.type===2||r.type===3)&&d>cinDate) cinDate=d }
    else if(!future||d<future) future=d;
  });
  if(dig) return 'digital';
  /* «В кино» — только если премьера была недавно. У старых фильмов в базе часто
     есть только дата проката и нет цифровой, из-за чего «Гарри Поттер» 2011 года
     годами показывался как идущий в кинотеатрах. */
  if(cinDate) return cinDate>=shiftDate(-4)?'cinema':'digital';
  if(future) return 'soon';
  const d=String(det.release_date||'').slice(0,10);
  if(!d) return 'prod';
  return d>t?'soon':'digital';
}
function ageFromDetail(det,mt){
  if(mt==='tv'){
    const rows=(det.content_ratings&&det.content_ratings.results)||[];
    const g=rows.find(x=>x.iso_3166_1==='RU')||rows.find(x=>x.iso_3166_1==='US');
    const v=g&&g.rating; return v?String(v).replace(/[^0-9]/g,'')||v:'';
  }
  const rows=(det.release_dates&&det.release_dates.results)||[];
  const g=rows.find(x=>x.iso_3166_1==='RU')||rows.find(x=>x.iso_3166_1==='US');
  const c=((g&&g.release_dates)||[]).map(x=>x.certification).filter(Boolean)[0];
  return c||'';
}

/* ---------------------------------------------------------------- запросы экранов */
const YOU={page:1,expanded:false,done:false,loading:false,empty:0,fr:{}};
const DUO={page:1,expanded:false,done:false,loading:false,empty:0,fr:{}};
/* Фильмы-семена: всё, чем человек уже показал свой вкус.
   Оценки — самый сильный сигнал, затем «посмотреть позже», затем просто
   просмотренное (в том числе то, что приехало импортом из заметки). */
function seedList(p){
  const has=new Set(), fr=new Set(), out=[];
  const push=(id,w)=>{
    if(has.has(id)) return;
    const f=byId(id); if(!f||!f.tmdb) return;
    if(isHidden(p,f)) return;
    /* от трёх «Человеков-пауков» подряд не отталкиваемся — иначе вся подборка
       превратится в одну франшизу. Один фильм серии, дальше следующая. */
    const k=frKey(f); if(k){ if(fr.has(k)) return; fr.add(k) }
    has.add(id); out.push({f,w});
  };
  const rated=Object.entries(p.ratings||{});
  rated.filter(([,v])=>v>=8).reverse().forEach(([id])=>push(id,3));
  rated.filter(([,v])=>v>=7&&v<8).reverse().forEach(([id])=>push(id,2.2));
  (p.lists.later||[]).slice().reverse().forEach(id=>push(id,1.6));
  (p.lists.seen||[]).slice().reverse().forEach(id=>{ if(p.ratings[id]===undefined) push(id,1) });
  rated.filter(([,v])=>v>=6&&v<7).reverse().forEach(([id])=>push(id,0.8));
  return out;
}
/* план обхода: сначала по одной странице от каждого семени, потом вторая и третья */
function seedCount(p){ return seedList(p).length }
function seedPlan(p){
  const seeds=seedList(p).slice(0,12), plan=[];
  for(let sub=1;sub<=3;sub++) seeds.forEach(x=>plan.push({f:x.f,sub}));
  return plan;
}
async function seedRecs(step){
  const d=await api(`/${step.f.mt}/${step.f.tmdb}/recommendations`,{page:step.sub},60*24).catch(()=>null);
  return d?mapList(d,step.f.mt):[];
}
/* вторая половина подборки — по жанрам: сюда попадают и любимые жанры из профиля,
   и те, что накопились из оценок и списков. Меняются веса — меняется и запрос. */
async function genreFetch(p,page){
  const w=affinity(p);
  const ids=Object.entries(w).filter(([,v])=>v>0.4).sort((a,b)=>b[1]-a[1]).slice(0,3)
    .map(([g])=>gidOf(g,'movie')).filter(Boolean);
  return discoverByGenres(ids,p.nov===undefined?1:p.nov,page);
}
async function discoverByGenres(ids,nov,page){
  /* Режим решает, у чего вообще спрашивать кандидатов.
     «Незаезженное» — высокий балл при скромном числе голосов и без ограничения
     по годам: так попадают старые и фестивальные вещи, а не то же самое, что у всех. */
  const q=nov>=2
    ? {with_genres:ids.join(','),sort_by:'vote_average.desc',

    : nov===1
      ? {with_genres:ids.join(','),sort_by:'popularity.desc',
         'vote_count.gte':ids.length?150:400,'vote_count.lte':250000,'vote_average.gte':6.4,
         'primary_release_date.gte':shiftDate(-180),page}
      : {with_genres:ids.join(','),sort_by:'popularity.desc',
         'vote_count.gte':ids.length?150:400,'vote_average.gte':6,
         'primary_release_date.gte':shiftDate(-60),page};
  const d=await api('/discover/movie',q,60*12);
  return mapList(d,'movie');
